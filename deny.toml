# cargo-deny configuration — dependency gate for the release checklist.
#
# Why cargo-deny rather than bare `cargo audit`: `cargo audit` scans
# `Cargo.lock`, which is platform-agnostic. This workspace ships a Windows-only
# product but pulls a GUI stack whose Linux backends (Wayland, D-Bus/AT-SPI) sit in
# the lockfile and never compile for `x86_64-pc-windows-msvc`. A bare `cargo audit`
# therefore reports advisories against code the product does not contain, which
# would make CI red from day one for reasons outside the product — and the usual
# reaction to that is a blanket `ignore`, which hides the Windows advisories that
# do matter. The `[graph] targets` filter below is what avoids both outcomes.
#
# Run: cargo deny check

[graph]
# The only target the product is built for. This is the entire point of the file.
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

ignore = [
    # All three entries below are unmaintained advisories inherited from Slint, and all
    # three were first attacked with feature trimming rather than accepted on sight. That
    # attempt is recorded here because its result is the reason these entries exist.
    #
    # `crates/settings` now takes Slint with `default-features = false`. That removed
    # `i-slint-renderer-femtovg`, `i-slint-renderer-software`, and `ksni` from the graph
    # outright. It removed none of the crates below, and `cargo-deny` was re-run to
    # confirm rather than assumed. What follows is therefore what could not be removed,
    # not what nobody looked at.
    #
    # ── Ships in the binary ─────────────────────────────────────────────────────────
    # `ttf-parser` (font-table parsing) and `rustybuzz` (text shaping) both reach
    # `i-slint-core`, which is linked into `wiradesk-settings.exe`. They arrive through
    # `resvg` → `usvg` → `fontdb`/`rustybuzz`, and `resvg` is switched on by
    # `i-slint-core`'s own `std` feature:
    #
    #     std = [ ..., "image-decoders", "svg", "path", ... ]
    #     svg = ["dep:resvg", "i-slint-common/svg-text"]
    #
    # `std` is required by both `backend-winit` and `renderer-skia`, so there is no
    # feature combination that keeps a desktop window and drops these two. Slint's
    # `no_std` path exists for microcontrollers, not for this.
    #
    # Why accepted: unmaintained is not vulnerable — neither advisory reports a flaw.
    # The data they parse is a system font under `%SystemRoot%\Fonts`, writable only by
    # administrators, and SVG content, of which this product ships none: there is not a
    # single `@image-url` in `crates/settings/ui/`. So the parsers are linked but their
    # attacker-facing input surface is empty.
    #
    # Note what changed. The previous version of this entry said `ttf-parser` was a
    # direct dependency of `crates/settings` with one call site in `theme.rs` guarding a
    # font handed to egui. That was true and is now false in every part: egui is gone,
    # the direct dependency is gone, and the crate arrives transitively through Slint.
    # Left uncorrected it would have been a justification defending a reachability that
    # no longer exists.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; linked via Slint's svg support, which its `std` feature forces. No known vulnerability; inputs are admin-writable system fonts, and this product ships no SVG." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; same chain and the same forced `std` feature as RUSTSEC-2026-0192. No known vulnerability." },

    # ── Build-time only ─────────────────────────────────────────────────────────────
    # `paste` is a proc-macro crate, and it enters solely through `i-slint-compiler` —
    # which this workspace reaches as `slint-build` (a build-dependency) and
    # `slint-macros` (a proc-macro). Its own path runs `pulp` → `exr` → `image`, because
    # the Slint compiler asks `image` for its default formats and OpenEXR is among them.
    #
    # It is never linked into a shipped executable, and that holds by construction rather
    # than by luck: the workspace sets `resolver = "2"`, which does not unify features
    # across build-dependencies and normal dependencies. `i-slint-core` asks `image` for
    # `png` and `jpeg` only, and resolver 2 keeps that build separate from the compiler's.
    #
    # `cargo-deny` reads the whole graph and has no switch to exclude build-dependencies,
    # so this must be an accepted entry rather than a scoping fix.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc-macro reached only through slint-build/slint-macros, so it runs at compile time and is never linked. Resolver 2 keeps the build-dependency feature set separate." },
]

[licenses]
version = 2
# MIT-licensed product; these are the permissive licenses the dependency graph is
# allowed to carry. A copyleft license appearing here should fail the build and be a
# deliberate decision, not a surprise discovered after publication.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # Slint is tri-licensed: `GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
    # LicenseRef-Slint-Software-3.0`. An `OR` expression is satisfied by allowing one
    # branch, and the branch accepted here is the royalty-free one. The other two are
    # deliberately absent rather than forgotten. `GPL-3.0-only` would pull the
    # distributed work under copyleft and contradict this product's MIT `LICENSE`; the
    # commercial licence buys nothing that a desktop application does not already get
    # for free, because its per-device royalty exists for embedded use.
    #
    # This entry is not free of obligation, which is the reason it carries a comment at
    # all. The royalty-free licence requires that the use of Slint be disclosed on a
    # public page where the binaries can be found. `README.md` and the release notes in
    # `.github/workflows/release.yml` carry that attribution, and deleting it from
    # either place breaks the licence this line accepts. The licence also forbids
    # redistributing an application that re-exposes Slint's own APIs; Settings is an
    # end-user application rather than a library, so that condition holds by shape and
    # not by anything anyone has to remember.
    "LicenseRef-Slint-Royalty-free-2.0",
    # The font licences that used to sit here — `OFL-1.1` and `Ubuntu-font-1.0`, carried
    # by `epaint_default_fonts` — left the graph together with egui. They are removed
    # rather than kept in case they return: an allow entry that no dependency needs is a
    # rule which cannot fail, and if a bundled face ever comes back, a red gate is the
    # point. Verified absent across all 600 packages `cargo metadata` resolves.
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are a size and audit-surface concern, not a correctness one, so
# they warn rather than fail — a GUI stack routinely carries a few. (Currently three
# `windows_x86_64_msvc` majors, pulled in by `embed-resource`, our own `windows-sys`,
# and `arboard` via eframe.)
multiple-versions = "warn"
# A wildcard version requirement on a published crate is a real supply-chain hazard:
# it accepts any future release, including a compromised one.
wildcards = "deny"
# ...but `shared = { path = "../shared" }` is counted as a wildcard too, and that is
# not the hazard the rule is for. A workspace-internal path dependency resolves to the
# source in this repository, never to the registry, so no unreviewed code can arrive
# through it. Without this, the gate fails on `daemon` and `settings` permanently and
# the honest fix would be misread as loosening `wildcards`.
allow-wildcard-paths = true

[sources]
# Everything must come from crates.io. An unexpected git or alternative-registry
# dependency is exactly the supply-chain change worth failing on.
unknown-registry = "deny"
unknown-git = "deny"
