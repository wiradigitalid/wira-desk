# SPRINT CHANGE PROPOSAL 2026-08-02 (bmad-correct-course, partially executed):
# ===========================================================================
# The proposal resolves the 11 `decision-needed` findings into three groups:
# seven already answered by a binding AC (ordinary dev work, no decision to
# make), two needing a new AC, and one genuine requirement conflict (NFR10).
#
# §4.2 DONE — commit 0e81cfb. `daemon/config.rs` created and
# `WM_APP_RELOAD_CONFIG` handled, with owned per-actor snapshots. This closes
# the most user-visible finding above: Settings reported "saved and applied"
# while the message fell through to DefWindowProcW, and a changed shortcut
# never took effect without a restart. 12 desktop-free tests; accept and
# reject paths both verified at runtime. Story 5-6 stays `in-progress` because
# two pieces remain: the §4.7 capture-state signal, and the Story 5.7 AC that
# a captured shortcut goes live with no restart (epics.md:1342).
#
# §4.1 (NFR10) HELD — the threshold is deliberately not set. Measurement work
# on 2026-08-02 showed every NFR10 figure on record (17.5 ms, 27.6 ms) came
# from `WM_APP_DEBUG_CYCLE_BURST`, which posts past the keyboard hook so the
# daemon never holds foreground rights: `activated=0, exhausted=1000`. Those
# numbers measure enumeration cost, not window rotation. The one valid sample,
# from physical keypresses, is p50 29.5 / p95 47.1 / max 197 ms over 36
# samples — 6% under the 50 ms the proposal had suggested, and still a debug
# build. `[profile.release-metrics]` now exists so NFR10 can be measured on
# release codegen; samples must come from physical keystrokes, as no SendInput
# harness can reach the activation path. Epics 3/4/5 therefore remain formally
# held by the latency figure until a valid measurement lands.
#
# NOT a regression, recorded because it was briefly misdiagnosed as one:
# cycling activation works. `verify-scenario-two-windows.ps1` reporting
# `exhausted` is a harness limitation — the same foreground-rights constraint —
# not a product defect. Its `never-jumps-to-another-application` assertion is
# vacuous while that holds, since it passes on any non-activating verdict.
#
# Also found: `verify-story-2-6-convergence.ps1` measures idle RAM on the debug
# binary while checking binary size on release, so its RAM verdict is not a
# product result.
#
# Next unit of work: Story 5.3 (§4.6 shortcut-collision AC + §4.9 pane
# grouping) — the only remaining item with no dependency and no open decision.
