# defects.yaml — SSOT for defects: ordinary bugs and hotfixes.

defects:
  - id: DEF-5
    title: Typing a digit by hand into a percentage field does not reach the value the stepper buttons read
    status: fixed
    severity: medium
    component: settings
    violates: [SPEC-2-01]
    found_in: "0.4.0"
    found_by: Owner live manual test on the elevated build, 2026-09-07 (post-DEC-016 finish, pre-merge of PR #17)
    tests:
      - shortcut_row_slint_snapshot::tests::a_real_keystroke_sequence_commits_a_typed_percentage
      - shortcut_row_slint_snapshot::tests::a_real_keystroke_sequence_out_of_range_is_refused
      - shortcut_row_slint_snapshot::tests::a_real_keystroke_sequence_commits_a_typed_stack_percentage
    fixed_in: SPEC-4-04
    fixed_by: >-
      One word. `pct_input`'s `key-pressed` callback returned `accept` for every key it did not
      special-case, and in Slint `accept` from a `TextInput`'s callback means the callback consumed
      the event -- so `TextInput::key_event` returned `EventAccepted` immediately and none of its
      built-in editing ran. Changed to `reject` (`shortcut_row.slint:279`, commit `753b1fb`).
      Established from primary source rather than by trying edits: `i-slint-core-1.17.1`'s
      `items/text.rs:958-967` for the consumption semantics, and `:2206` for the
      `InputType::Number` filter that ruled out the first candidate. All five of this row's
      candidates were ruled in or out explicitly.
      Verified by the coordinator rather than from the report: restoring the `accept` reds all three
      tests above, and the diff is one markup line plus 68 added test lines with ZERO deletions, so
      the five `set_accessible_value` tests this row names in `summary` are untouched and green.
    residual: >-
      The three tests drive real character events through the window's own queue, which is the path
      this defect lived in the gap of. What they do NOT cover is a physical keypress reaching the
      daemon's hook: `DEF-12` records why an agent cannot test that at all.
    summary: >-
      The owner reports that on the live standalone build, typing a number directly into a Shortcuts-pane
      percentage field (`crates/settings/ui/components/shortcut_row.slint`'s `pct_input`) has no visible
      effect -- only the `+`/`-` stepper buttons change the value. Every existing automated test for
      `SPEC-2-01`'s commit-on-departure behaviour (`typed_percentage_commits_on_save_click` and its four
      siblings in `shortcut_row_slint_snapshot.rs`) drives the field through
      `ElementHandle::set_accessible_value`, i.e. the UI Automation `RangeValuePattern` /
      `accessible-action-set-value` path -- not through simulated character key presses reaching the
      `TextInput`'s native text-entry handling. Those tests prove the commit-on-departure LOGIC is correct
      once a value lands in `root.typed_text`; they do not prove a physical keystroke gets a digit into
      `typed_text` in the first place. The two paths are different code, and only one of them has ever
      been exercised by a test or by automation (the live smoke test in `.scratch/live-test-dec-016.md`
      hit the same live standalone binary and independently could not drive real keyboard input into this
      window either, for an unrelated automation-side reason -- `SetForegroundWindow` refused to a
      background process -- which is not this defect, but left this exact path untested from both sides
      until the owner tried it by hand).
    why_it_hid: >-
      Every seam this feature was tested at (`shortcut_row_slint_snapshot.rs`, `layout_pane_slint_snapshot.rs`)
      drives values in through the accessible-value setter because that is the only reliable way to script
      a Slint `TextInput` from a `#[test]`. Nothing in the suite types a character and checks it landed.
      `pct_input`'s own `key-pressed` handler only special-cases `Tab`/`Backtab`; ordinary character keys
      fall through to Slint's built-in `TextInput` editing, which was never separately asserted on.
    impact: >-
      A user who tries to type "68" into a snap-percentage or (once `DEC-014` ships) the Overlapping Stack
      width field, expecting free-text entry, sees nothing happen and has to discover the stepper buttons
      instead -- the opposite of what `SPEC-2-01`'s own acceptance criteria promised ("should be able to
      type freetext, with validation"). Whether this is `input-type: number` narrowing accepted characters,
      a focus/z-order gap between `pct_field_touch`'s `TouchArea` and the `TextInput` beneath it, or
      something else entirely is not yet known -- this row is deliberately not naming a root cause it
      has not verified.
    fix_direction: >-
      Root-cause with `wdi-systematic-debugging` before proposing a fix, per this repo's own standing rule
      for any bug with an unknown cause -- do not guess at `input-type` or focus/z-order and patch blind.
      Whatever the cause, the fix MUST be provable by a test that drives the field the way this one wasn't:
      a real simulated key-press sequence (not `set_accessible_value`) that types digits and asserts they
      land in `typed_text`/commit, in addition to the existing accessible-value tests, which stay -- they
      cover the automation/assistive-technology path and MUST NOT be weakened to make room for the new one.
    owner: repo owner

  # The `- id: DEF-1` marker below was missing, so every field of DEF-1 was parsed as a
  # continuation of DEF-5's mapping and won on last-wins. The consequences were not cosmetic:
  # DEF-1 did not exist as a row at all, and DEF-5 -- the defect `SPEC-4-04` is open to fix --
  # read back as `status: fixed`, `severity: high`, `component: window-management`. `validate.py`
  # was GREEN throughout, so nothing in the corpus checks that a defect row is its own row.
  - id: DEF-1
    title: Two hook tests depend on the live desktop and fail with no foreground window
    status: fixed
    severity: high
    component: window-management
    violates: [NFR-4]
    found_in: "0.1.0"
    found_by: W1 verification wave, 2026-08-21
    tests:
      - hook::tests::win_up_passes_through_after_win_shortcut
      - hook::tests::win_up_not_suppressed_for_alt_fallback
    summary: >-
      `handle_key_event` asks the OS whether the foreground window is a VM or RDP client the
      moment a chord matches, and correctly so -- in production that question can only be
      answered live. But it reaches `GetForegroundWindow` through
      `vm_bypass::evaluate_foreground`, and the two tests above call `handle_key_event`
      directly. When the calling process has no resolvable foreground window,
      `HookIdentityCollector::collect` returns `WideIdentity::default()`,
      `classify_wide` returns `Passthrough(BypassReason::IdentityUnavailable)` -- failing open,
      by design -- and the matched chord returns `PassToNext`. The assertion expects `Swallow`,
      and the observed failure is exactly `left: PassToNext, right: Swallow`.
    why_it_hid: >-
      The sibling test `hook::tests::no_modifier_release_is_ever_swallowed` walks the same key
      sequence and passes, because it discards the backtick dispositions with `let _ =` and
      asserts only the modifier release. So the strongest-looking guard on this behaviour is
      the one that cannot catch this, and the suite looks healthier than it is.
    impact: >-
      The suite is not deterministic: it passes when the test process can resolve a foreground
      window and fails when it cannot. CI runs `cargo test --workspace --locked` on
      `windows-latest`, where a job has no interactive desktop, so these two are expected to
      fail there every run. The product code is NOT at fault -- asking the OS live is the
      correct production behaviour, and the VM/RDP passthrough it guards is deliberate.
    fix_direction: >-
      Give `handle_key_event` a seam for the bypass decision, as it already has one for
      `BypassPolicy`, so a unit test supplies the identity instead of the desktop. MUST NOT be
      fixed by weakening or deleting the assertions: they guard the sticky-modifier bug, where
      a swallowed Win key-up left the focused application treating every later keystroke as
      Win+key.
    owner: repo owner
    fixed_in: W1
    fixed_by: >-
      `handle_key_event` split into a thin wrapper plus
      `handle_key_event_with_bypass`, which takes the bypass check as an
      `FnOnce(&mut HookRuntime) -> bool`. A closure rather than a `bool` on purpose: the live
      Win32 query must stay lazy so it still runs only after a chord matches, never on every
      keystroke. Production behaviour is unchanged -- the wrapper supplies the real
      `evaluate_foreground` call -- and the two tests supply `|_| false`. Every assertion and
      expected value is unchanged. Verified: `cargo test --workspace` exits 0, 330 passing;
      clippy clean under `-D warnings`.
    residual: >-
      `hook::tests::no_modifier_release_is_ever_swallowed` still calls the live
      `handle_key_event`, so it still queries the desktop. Its assertion holds on both branches
      -- a bypassed chord never sets `swallow_release_vk`, so the modifier release passes
      through either way -- which means it would also pass if the bypass swallowed everything.
      That is the shape `docs/decisions.md` warns about: a test that can pass for the wrong
      reason. Now routed through the same seam, so all three tests supply the bypass decision
      explicitly and none of them reads the desktop. Assertion and failure message unchanged.


  - id: DEF-6
    title: All four custom-percentage rows announce the same accessible name
    status: open
    severity: low
    component: settings
    violates: [FR-20, FR-21]
    found_in: "0.4.0"
    found_by: Standards-axis review of SPEC-4-02, 2026-09-07 (pre-existing, not introduced by it)
    tests: []
    summary: >-
      `SnapPercentLeft`, `SnapPercentRight`, `SnapPercentTop` and `SnapPercentBottom` each render
      the same four accessible names — "Decrease snap percentage", "Snap percentage field",
      "Snap percentage input", "Increase snap percentage". A screen-reader user moving through the
      Shortcuts pane therefore cannot tell the left-edge percentage control from the top-edge one:
      four focusable controls, one name each, repeated four times over.
    why_it_hid: >-
      `shortcut_row.slint` already hardcoded exactly these four strings, unconditionally, for every
      percentage row -- so nothing changed when `SPEC-4-02` moved them into declared `theme.rs`
      vocabulary. (The range-based conditional that briefly chose between the two families existed
      only mid-ticket and was removed in the same ticket; it is not where these strings came from.) And
      `theme::tests::accessible_names_are_unique` compares the CONSTANTS to each other, where each
      name appears once and is genuinely unique. The duplication is in the RENDERED tree, across
      rows, which that guard does not look at. `DEF-2` was the same class of fault — two focusable
      controls sharing a name — caught then because both controls sat in one pane.
    impact: >-
      Accessibility only; no functional defect and nothing is mis-saved. The four rows are still
      distinguishable by their row title, which a screen reader reads, so this degrades navigation
      rather than blocking it. `DEF-2` carried `low` for the same fault class, so this row matches
      that precedent rather than departing from it.
    fix_direction: >-
      Per-direction names, e.g. "Left edge percentage input", rather than one shared set for the
      family. That needs a `ShortcutField`-keyed label set rather than the two-family split
      `SPEC-4-02` introduced, so it is a design change and belongs to its own ticket rather than
      to `SPEC-4`, whose remaining two tickets are both already scope-guarded against it.
    owner: repo owner

  - id: DEF-2
    title: Two focusable controls share the accessible name "Stack width percent"
    status: fixed
    severity: low
    component: settings
    violates: [FR-20]
    found_in: "0.1.0"
    found_by: RISK-3 accessibility re-verification on eframe 0.36.1, 2026-08-22
    tests:
      - theme::tests::accessible_names_are_unique
      - app::tests::focus_order_has_no_duplicates
      - app::tests::focus_order_is_stable_across_calls
      - app::tests::focus_order_starts_with_navigation_and_ends_with_actions
    # `SPEC-4-02` retired the Layout pane, and with it `focus_order(Pane::Layout)` — the one
    # production reader of `theme.rs`'s three `STACK_WIDTH_*` names. The three `focus_order_*`
    # guards above therefore no longer touch these controls at all, and
    # `accessible_names_are_unique` iterates constants the UI no longer draws. The stack-width
    # controls DO still carry three distinct accessible names on their new Overlapping Stack row,
    # so this defect's symptom has not returned — but its named guards stopped covering it, which
    # is recorded here rather than left for a future reader to discover. `SPEC-4-02`'s return trip
    # re-points the markup at those constants and adds the guard that makes this row true again.
    summary: >-
      `focus_order(Pane::Layout)` declares "Stack width percent" as ONE focus stop, but the
      published UI Automation tree carries two focusable controls with that identical name --
      a `Slider` (`range=50[10..100]`) and a `Spinner` (`value='50'`, `range=50[10..100]`) --
      plus a static `Text` with the same string. A Tab walk of the Layout pane therefore lands
      nine times, not eight, and a screen reader announces the same name twice with nothing to
      distinguish the slider from the spin box.
    why_it_hid: >-
      `focus_order_mismatch` compares the declaration against the stops the RENDERER reports it
      drew, not against the UIA tree. The renderer reports one stop for the widget, so the
      declaration and the renderer agree with each other and the assertion passes -- while
      neither matches what assistive technology actually sees. This is the exact blind spot
      RISK-3 named: `app::tests::focus_order_*` proves the declared focus order, not the tree.
    impact: >-
      Minor. Both stops are reachable, correctly named, and expose their value and range, so no
      control is unreachable or silent -- FR-21 is unaffected. What suffers is FR-20's
      "Tab order follows intuitive visual flow": one logical field costs two Tab presses and
      announces one name twice.
    owner: repo owner
    fixed_in: main
    fixed_by: >-
      Split into distinct accessible semantics in `crates/settings/src/theme.rs` (`STACK_WIDTH_SLIDER`
      and `STACK_WIDTH_INPUT`). `crates/settings/src/main.rs` binds the slider text to
      `STACK_WIDTH_SLIDER.name` and records both stops into drawn list; `crates/settings/src/app.rs`
      declares both in `focus_order(Pane::Layout)`. Uniqueness and focus-stop order verified by
      unit tests and full workspace test run.

  - id: DEF-3
    title: The shortcut capture lease can never arm — Settings sends a PID where the daemon reads an HWND
    status: fixed
    severity: high
    component: settings
    root_cause: architecture
    violates: [UC-4, FR-7]
    decision: DEC-004
    found_in: "unreleased"
    found_by: Capture-lease scope consultation, 2026-08-26
    summary: >-
      Three places describe `WM_APP_CAPTURE_LEASE`'s `lParam` and two of them disagree.
      `crates/shared/src/constants.rs:141,145` -- the contract, and the SSOT -- says
      `lParam` = Settings window HWND. `crates/settings/src/persistence.rs:176` sends
      `std::process::id()`, a PID, and its own SAFETY comment says so.
      `crates/daemon/src/tray.rs:399-406` reads the value as an HWND and calls
      `GetWindowThreadProcessId` on it to derive a PID. That call fails for a value that is
      not a window handle and leaves its out-parameter untouched, so `pid` stays 0;
      `crates/daemon/src/hook.rs:883` stores 0, and the guard at `:274`
      (`rt.capture_lease_pid != 0`) then makes the whole branch unreachable. The lease has
      never once armed. In the improbable case where a PID value collides with a live HWND,
      the daemon derives some unrelated process's PID instead, which is not better -- it is
      the same failure with a worse shape.
    why_it_hid: >-
      Three things, and the first is the one worth remembering. (1) The SSOT is on the wrong
      side: because `constants.rs` says HWND, `tray.rs` is correct against the contract and
      `persistence.rs` is the violator -- so a review that reads either side against the
      contract confirms that side. The fix therefore has to change the contract, not just
      code. (2) No test touches it. `capture_lease_pid` appears only in two `HookRuntime`
      initialisers, both 0, and the branch is unreachable from a test by construction: it
      calls `rt.identity.foreground_pid()` directly, which is `GetForegroundWindow` at
      `crates/daemon/src/context/vm_bypass.rs:119`, and a test harness with no foreground
      window returns 0 while the guard demands non-zero. This is DEF-1's failure repeating
      one branch earlier -- the lease check sits ABOVE the `handle_key_event_with_bypass`
      seam DEF-1 introduced, so it never benefits from it. (3) The debug trace misleads:
      `hook.rs:886` prints `HOOK_LEASE: arm=true pid=0`, and 0 is indistinguishable from a
      disarm, so a reader of the log blames Settings for not sending.
    impact: >-
      UC-4's recording step cannot work for any chord that is already one of the six
      configured shortcuts: the daemon claims its own chord while Settings is trying to
      re-record it, so the window switches and Settings loses the foreground. This is the
      reported symptom. It also blocks the observe lease `DEC-004` and `DEC-005` are built
      on, because both read the same PID comparison. Not yet shipped -- none of the lease
      code is in `HEAD`; it is uncommitted work in the working tree, which is why this row
      is a finding about unfinished work rather than a regression against a release.
    fix: >-
      Not `fastpath`. Gated on `DEC-004` reaching `accepted` -- the wave that carries it does
      not exist yet, so no wave id can honestly be named here.
    fix_direction: >-
      Carry the PID and delete the HWND conversion, correcting `constants.rs` in the same
      change so the contract stops sanctioning the wrong shape: the hook compares against a
      PID, `std::process::id()` cannot fail, and a PID is inert data where a cross-process
      HWND is a handle whose validity the sender cannot guarantee. Encode the lease level in
      `wParam` (0 none, 1 observe, 2 record) rather than adding a second message or a second
      boolean. MUST NOT be closed by fixing only `persistence.rs`: that leaves the contract
      saying HWND, and the next reader restores the bug. The lease decision MUST also move
      behind a seam of the shape DEF-1 established, so a test can supply the foreground
      identity instead of the desktop -- an untestable branch is what let this ship as far
      as it did.
    owner: repo owner
    fixed_in: unreleased
    fixed_by: >-
      `crates/shared/src/constants.rs` corrected first: `WM_APP_CAPTURE_LEASE` /
      `WM_APP_HOOK_LEASE` now document `wParam` as the lease level
      (`CAPTURE_LEASE_NONE`/`_OBSERVE`/`_RECORD`) and `lParam` as the Settings
      process id -- never an HWND. `crates/daemon/src/tray.rs` forwards the pid
      unchanged and deletes the `GetWindowThreadProcessId` conversion entirely.
      `crates/daemon/src/hook.rs` stores level and pid together
      (`HookRuntime::capture_lease_level`/`capture_lease_pid`), decides the
      lease through a new pure `lease_action` seam that takes the foreground
      lookup as a lazy closure (the same shape `DEF-1` established one branch
      lower), and the comparison now runs before `match_shortcut` so an
      unconfigured chord such as `Win+1` reaches it -- the fix for the actual
      reported symptom. A dead lease holder is reaped on the existing
      heartbeat (`OQ-17`), never inside the callback.
      Verified: `hook::tests::record_lease_swallows_an_unconfigured_chord_before_match_shortcut`
      seen failing -- reverted the reordering, watched it fail with
      `left: PassToNext, right: Swallow`, restored the fix, watched it pass.
      `cargo test --workspace` (`WIRADESK_SKIP_MANIFEST=1`) exits 0, 366
      passing across `daemon`/`settings`/`shared`; `cargo clippy --workspace
      --all-targets -- -D warnings` clean; `cargo fmt --all -- --check` clean.
    residual: >-
      Addressing by pid still carries `OQ-17`'s pid-reuse window between an
      exit and the next heartbeat tick; disarm-on-every-exit-path plus
      heartbeat reaping narrows it, and it is carried as a known residual
      rather than described as closed.

  - id: DEF-4
    title: KeyCheckVerdict::Intercepted is declared but never constructed — a chord swallowed by another hook reads as "Daemon Not Running"
    status: fixed
    severity: low
    component: settings
    root_cause: incomplete implementation
    violates: [DEC-005]
    found_in: "0.4.0"
    found_by: >-
      wdi-reconcile code-vs-doc trace, 2026-09-03; confirmed as a real gap rather than an
      accepted simplification by the product owner the same day (`OQ-36`).
    summary: >-
      `DEC-005` and `KeyCheckVerdict` (`crates/settings/src/app.rs`) declare four outcomes for
      the Key Check pane. `record_key` only ever produces three: `Received` (hook and window
      both correlate), `ClaimedByOtherApp` (window event arrived, no correlating hook report,
      within a grace timeout), and `DaemonNotRunning` — assigned identically whether the daemon
      is genuinely absent, or the daemon is running but no hook report ever correlates because
      an earlier third-party keyboard hook swallowed the chord before Wira Desk's own hook saw
      it. `KeyCheckVerdict::Intercepted`, meant for exactly that second case, is declared with a
      doc comment ("Intercepted by external LL hook / swallowed, chord dead") and never
      constructed by any code path.
    impact: >-
      A user whose daemon is running normally, testing a chord that another running program's
      keyboard hook consumes first, is told "Daemon Not Running" — the wrong diagnosis. The
      correct fix is local: it points them at restarting a daemon that was never the problem,
      rather than at the actual external hook. No keystrokes or shortcuts are lost; this is a
      diagnostic-message defect, not a functional one, which is why severity is low despite the
      wrong-diagnosis cost.
    fix_direction: >-
      In `record_key`, when `daemon_running` is true and no hook report correlates within the
      observation window, construct `Intercepted` instead of reusing `DaemonNotRunning`. The
      `daemon_running` flag already distinguishes the two root causes; the fix is using it on
      this branch rather than only on the true-absence branch. `DEC-005`'s own boundary
      paragraph in `SDD-settings.md` already states the honest-silence stance this closes one
      more gap in — no design change needed, only wiring the fourth outcome the decision
      already named.
    owner: repo owner
    fixed_in: fastpath (no FR/UC/AD-N/domain-model touched, one ticket, no third party)
    fixed_by: >-
      `crates/settings/src/app.rs::record_key` — the branch that reused `DaemonNotRunning` for
      "daemon running, nothing correlated" now constructs `KeyCheckVerdict::Intercepted`
      instead, matching the row `DEC-005`'s table and the enum's own doc comment already named.
      The pre-existing test `a_window_event_with_no_hook_report_reports_daemon_not_running` was
      itself asserting the bug (it passed `daemon_running: true` and expected
      `DaemonNotRunning`); renamed to
      `a_window_event_with_no_hook_report_while_the_daemon_runs_reports_intercepted` and its
      assertion corrected. Added
      `a_window_event_with_the_daemon_absent_reports_daemon_not_running`
      (`daemon_running: false`) — the genuine daemon-absent path had no test at all before this.
      Verified: the renamed test seen failing first (`left: DaemonNotRunning, right:
      Intercepted`) before the fix, green after. `cargo test --workspace`
      (`WIRADESK_SKIP_MANIFEST=1`) exits 0, 491 passing across `daemon`/`settings`/`shared`;
      `cargo clippy --workspace --all-targets -- -D warnings` clean; `cargo fmt --all` clean.

  - id: DEF-7
    title: The Settings window has no Tab order, because nothing in its shell is focusable
    status: open
    severity: medium
    component: settings
    # `LBR-ST-5` is the rule this breaks, but rules carry no registry id in this repo and
    # `refs-resolve` requires one, so the resolvable promise behind it is named instead: FR-20 is
    # "All interactive settings controls are fully keyboard-navigable ... via logical Tab order".
    violates: [FR-20]
    found_in: "0.4.0"
    found_by: Coordinator verification of SPEC-4-03 return trip 1, 2026-09-08
    tests: []
    summary: >-
      `LBR-ST-5` (`status: active`) requires "a deterministic Tab navigation order that starts with
      navigation tabs and terminates with action buttons". The Settings shell cannot satisfy it and
      never could: the only `FocusScope` anywhere in `crates/settings/ui/` outside a shortcut row is
      `key_handler` in `main_window.slint`. `SidebarItem` is a `Rectangle` with a `TouchArea`, the
      Save and Revert buttons are the same shape, and neither is reachable by keyboard at all. So
      there is no "navigation tabs first" to start the order with and no "action buttons" to end it
      at -- there is no order.
    why_it_hid: >-
      `crates/settings/src/app.rs`'s `focus_order` declares one, and `focus_order_mismatch` guards
      it -- but that test only ever compares `focus_order`'s output to itself, and no rendered
      element carries `f.label()` as an accessible name, so the declaration has never been checked
      against the window. The rule therefore read as satisfied by a guard that could not fail.
      Separately, `MainWindow` sets `forward-focus: key_handler` and that scope returned `accept`
      for every key, so Tab was swallowed before Slint's focus traversal could run: the absence of
      an order was invisible because Tab did nothing at all.
    impact: >-
      A keyboard-only user cannot reach the pane navigation or the Save and Revert buttons. Since
      `SPEC-4-03` return trip 1 made `key_handler` reject Tab so focus traversal runs, Tab now
      lands on the first shortcut row's description block -- which is what makes the gap visible,
      and is an improvement on Tab doing nothing, but it is not the order the rule names.
    fix_direction: >-
      Give the shell real focus stops -- `SidebarItem` and the action buttons become focusable
      controls with `focus-on-tab-navigation` -- and then declare the order where `LBR-ST-5` says
      it starts and ends. `focus_order` MUST end up checked against the rendered tree rather than
      against itself, or this returns the same way it hid. Deliberately NOT `SPEC-4-03`'s: it is a
      shell-wide change across `sidebar.slint` and `main_window.slint`, the ticket's builder
      escalated it rather than widening scope, and that was the right call.
    owner: repo owner

  - id: DEF-8
    title: The Settings keyboard callbacks are registered only in main(), so main()'s wiring and handler are untested
    status: open
    severity: medium
    component: settings
    violates: [DEC-005]
    found_in: "0.4.0"
    found_by: Coordinator verification of SPEC-4-03 return trip 2, 2026-09-08
    tests: []
    summary: >-
      `crates/settings/src/main.rs` registers `on_key_pressed_event` and `on_key_released_event`
      inside `main()` (from line 721), not inside `bind_callbacks` (lines 322-473). Every test
      builds its window through `bind_callbacks`, so in every test those two callbacks are unset
      and `root.key_pressed_event(...)` from `main_window.slint` is a no-op. The entire keyboard
      path behind them is therefore unreachable from the suite: the Key Check live diagnostic
      `DEC-005` specifies, the `CaptureState::Listening` chord capture, the Escape cancel, and
      onboarding step 2's Win+backtick handling.
    why_it_hid: >-
      `bind_callbacks` exists precisely so a test gets the production wiring, and it is easy to
      assume anything reachable from the window is inside it. The keyboard registration simply
      never moved there. Nothing fails as a result -- an unset Slint callback returning no value is
      a silent no-op, not an error -- so the gap presents as "these behaviours have no tests"
      rather than as a broken test.

      CORRECTED 2026-09-08, and the correction narrows this row: the original wording said no test
      could exercise this path at all, and that was too strong. A test can register its own
      `on_key_pressed_event` listener, and two now do (see `SPEC-4-05`'s tests), which guards the
      MARKUP's forwarding contract. What remains untested is `main()`'s own registration and the
      handler behind it -- the Key Check recording, the `Listening` capture branch, the Escape
      cancel, and onboarding step 2. That is what this row is now about.
    impact: >-
      `DEC-005`'s four-row correlation table, which is the only set of claims the key check may
      make, has no automated guard of any kind. `SPEC-4-03` return trip 2 was a real regression in
      exactly that area -- `key_handler` had stopped forwarding Tab to Rust, which would have made
      the check report a third-party claim that did not exist -- and nothing in the suite caught it
      at the time. It would be caught now: `SPEC-4-05` added the two guards that were wrongly
      believed impossible. The handler's own behaviour is still unguarded.
    fix_direction: >-
      Extract the keyboard registration into a function `bind_callbacks` also calls (or move it
      there outright, if nothing in it depends on `main()`'s locals beyond what `bind_callbacks`
      already receives), then write the tests the path has never had: a real
      `WindowEvent::KeyPressed` sequence asserting `key_check.last_display`, a `Ctrl+Alt+Tab`
      capture asserting the chord is recorded, and Escape cancelling a capture. Keys DO reach
      `key_handler` in the testing backend -- proven twice over: reverting `SPEC-4-03`'s `reject`
      lines reds `shortcut_row_slint_snapshot.rs:554`, and `SPEC-4-05`'s two guards observe
      forwarded keys directly. The harness is not the obstacle and MUST NOT be blamed for it. This is deliberately NOT `SPEC-4-03`'s: its two return trips
      were spent, and moving production wiring is not a coordinator's unit-test work.
    owner: repo owner

  - id: DEF-9
    title: Keyboard events reach the Settings Rust layer only while the window's own FocusScope holds focus
    status: fixed
    severity: high
    component: settings
    violates: [DEC-005]
    found_in: "0.4.0"
    found_by: Spec-axis review panel on SPEC-4-03, 2026-09-08
    tests:
      - shortcut_row_slint_snapshot::tests::an_unconsumed_key_still_reaches_rust_after_focus_moves_into_a_row
      - shortcut_row_slint_snapshot::tests::tab_is_forwarded_to_rust_before_it_is_rejected_for_focus_traversal
    fixed_in: SPEC-4-05
    fixed_by: >-
      The outer `Rectangle` holding every pane is now nested INSIDE `key_handler`, so an unconsumed
      key bubbles up to it instead of dying in a sibling subtree; the scope gained
      `width: 100%; height: 100%`, which it needs once it has children (`main_window.slint`, commit
      `d26c416`). `forward-focus: key_handler` is unchanged, so a fresh window still starts with
      focus there. The builder confirmed the mechanism by probe BEFORE changing anything: with the
      sibling structure an unconsumed `'y'` after a Tab press never arrived, and after the fix it
      did.
      The two tests above were written by the coordinator afterwards and both were seen red -- the
      pre-fix sibling structure reds the first with no keys forwarded at all, and moving the
      `reject` above the forward reds the second with Tab missing. They exist because an earlier
      note of mine claimed this path could not be tested; a test can register its own
      `on_key_pressed_event` listener, and that claim was wrong.
    residual: >-
      The tests guard the MARKUP's forwarding contract. What `main()`'s handler then does with a
      bubbled key -- the Key Check recording, the `Listening` capture branch, the Escape cancel --
      is still unguarded, because that registration sits outside `bind_callbacks` (`DEF-8`). So the
      Escape-cancel-from-moved-focus path is verified only by `SPEC-4-05`'s smoke steps, and
      `DEF-12` records that even those cannot exercise the hook correlation.
    summary: >-
      `crates/settings/ui/main_window.slint` declares `key_handler := FocusScope` (line 149) as a
      SIBLING of the outer `Rectangle` that holds every pane (line 179) -- both are direct children
      of the `Window`, and `key_handler` has no children of its own. Slint delivers a key event to
      the focused element and bubbles it up that element's ANCESTORS, so a sibling subtree never
      receives it. `root.key_pressed_event(...)` therefore fires only while `key_handler` itself
      holds focus, and it is the sole entry point for four behaviours: the Key Check live
      diagnostic `DEC-005` specifies, Escape-cancels-capture, `CaptureState::Listening` chord
      capture, and onboarding step 2's Win+backtick.
    why_it_hid: >-
      `MainWindow` sets `forward-focus: key_handler`, so a freshly opened window has focus there
      and everything works. Nothing took focus away in normal use until a control asked for it,
      and the only pre-existing route was `pct_input.focus()` in `shortcut_row.slint` -- clicking
      a percentage field. Both the structure and that route predate `SPEC-4-03` (verified at
      `0c6f405~1`), so this is not a regression that ticket introduced. What that ticket changed is
      reachability: making `key_handler` reject Tab so focus traversal runs means ONE Tab press now
      moves focus to a row's description block, and it is the intended behaviour of its own
      criterion 2. No test could see any of it -- see `DEF-8`, which is why.
    impact: >-
      Press Tab once in Settings, then click a keycap to rebind a shortcut: the row sits in
      "Listening..." forever, no chord is ever recorded, and Escape cannot cancel it. The Key Check
      band goes blind at the same moment, and because `DEC-005` reads hook-saw against window-saw,
      a chord pressed in that state reports as "another application claimed it" -- a fabricated
      third party, which is the one verdict `DEC-005` exists to refuse. The same happens after
      clicking any percentage field, which is the route that already existed.
    fix_direction: >-
      Nest the outer `Rectangle` INSIDE `key_handler` so every unconsumed key bubbles up to it,
      rather than leaving it a childless sibling. Keep the Tab traversal `SPEC-4-03` added and
      re-check it afterwards: `description_renders_as_a_tooltip_not_a_visible_line` must stay
      green, and the `listening_field == -1` guard must still keep a mid-capture Tab out of focus
      traversal. Verification of the BUBBLING is a `#[test]` after all:
      `an_unconsumed_key_still_reaches_rust_after_focus_moves_into_a_row` registers its own
      callback and reds on the sibling structure with forwarded keys `[]`. What a test still cannot
      reach is what `main()`'s handler then DOES with the key, so `SPEC-4-05`'s three smoke steps
      remain the only check on chord capture and Escape-cancel from a moved-focus state. They MUST
      NOT be replaced by `SPEC-4-03` Amendment 4's pair, which both start from a fresh window --
      exactly the state that already worked.
    owner: repo owner

  - id: DEF-10
    title: The publication gate cannot see .slint, and five findings its own pattern would report already sit there
    status: open
    severity: low
    component: settings
    violates: [NFR-4]
    found_in: "0.4.0"
    found_by: Standards-axis review panel on SPEC-4-03, 2026-09-08
    tests: []
    summary: >-
      `scripts/verify-public-export.ps1`'s `$textExtensions` (line 61) lists nineteen extensions
      and omits `.slint`, so the entire Slint UI layer is never scanned by the gate `AGENTS.md`
      names as the enforcement of what may appear in this repository. It is not hypothetical: the
      gate's own `$checkLanguage` pattern would report five findings in
      `crates/settings/ui/components/key_check.slint` today, at lines 4, 5, 18, 49 and 172: five
      source comments written in Indonesian rather than English. They are not quoted here, because
      quoting one puts the same finding into this file -- which is exactly what happened on the
      first attempt at this row, and the gate caught it.
    why_it_hid: >-
      The omission is invisible from either side: the gate reports a clean run because it never
      opened the files, and the files look fine because nothing ever complained about them. Three
      `.slint` files were changed during `SPEC-4-03` and none was checked; that diff happens to be
      clean, measured pattern by pattern, so even a careful reviewer would have seen no symptom.
    impact: >-
      A whole file type in product source is outside the only automated check on publication
      hygiene, and it is the file type this product's entire user interface is written in. The five
      existing findings are comments rather than anything sensitive, so nothing is leaking today --
      the cost is that the gate's green means less than it claims.
    fix_direction: >-
      Add `.slint` to `$textExtensions`, then fix what the gate reports -- translate those five
      comments. MUST NOT widen or exempt a pattern to make the findings disappear: `AGENTS.md`
      names that as the failure mode the file exists to prevent, so the extension going in and the
      comments being fixed are one change, not two.
    owner: repo owner

  - id: DEF-11
    title: The daemon's memory budget has never been measured on a fresh idle release build
    status: open
    severity: low
    component: window-management
    violates: [FR-9]
    found_in: "0.1.5"
    found_by: Smoke test for mandate DEC-017, 2026-09-08
    tests: []
    summary: >-
      `FR-9`'s `proof` read, BEFORE `DEC-027` raised it, "The background daemon runs with an
      active system tray icon while consuming under 2 MB of static RAM." The running daemon was
      measured at
      `WorkingSet64 = 31,182,848` bytes (~29.7 MB) and `PrivateMemorySize64 = 4,214,784` bytes
      (~4.0 MB). Even the private-bytes figure, which is the fairer of the two, is double the
      promise; the working set is fifteen times it.
    why_it_hid: >-
      Nothing measures it. `FR-9` is one of the eight `no_uc` rows the `DEC-017` mandate recorded as
      RTM-exempt, it is carried by no spec, and no test or gate asserts a memory ceiling anywhere in
      the workspace. The number therefore had no way to be contradicted until something looked.
    impact: >-
      A stated promise is out by more than an order of magnitude on one reading of it and by a
      factor of two on the other. That is a documentation-versus-reality question rather than a
      user-visible fault -- nobody has reported the daemon being heavy -- but it is exactly the kind
      of number that gets quoted in a comparison against another tool.
    fix_direction: >-
      HALF ANSWERED by `DEC-027` (2026-09-13), half still open. (1) SETTLED: the owner raised the
      budget to 5 MB and fixed the metric as private bytes on a release build, idle, with the
      overlay closed -- working set is explicitly not the governed number. The reason recorded is
      that the visual switcher (SPEC-12, SPEC-13) added an overlay, a GDI buffer, and per-card DWM
      thumbnails that the 2 MB figure predates, NOT that 3.6 MB was observed. That distinction is
      what keeps this from being the failure the original wording forbade. (2) STILL OPEN, and this
      is now the whole of the defect: MEASURE THE RIGHT BINARY. The 4.0 MB private reading came from
      a daemon built 2026-08-28, three weeks before the code it was judged against, resident for
      eight hours; the 3.6 MB figure is manual observation, not an instrumented run. 5 MB is a
      budget set from reasoning, not evidence. Nothing in the workspace asserts any memory ceiling,
      so the new number is exactly as unenforced as the old one. The standing prohibition is
      unchanged and still binds every agent: this MUST NOT be closed by editing a number to match a
      measurement.
    owner: repo owner

  - id: DEF-12
    title: An agent-driven smoke test cannot verify the key check, because the hook discards injected input
    status: open
    severity: medium
    component: window-management
    violates: [DEC-005]
    found_in: "0.1.5"
    found_by: Smoke test for mandate DEC-017, 2026-09-08 -- reported unprompted by the runner
    tests: []
    summary: >-
      The daemon's `WH_KEYBOARD_LL` hook deliberately discards synthetic keystrokes in release
      builds: `#[cfg(not(debug_assertions))] fn accept_injected() -> bool { false }` drops any event
      carrying `LLKHF_INJECTED`. Every automated driver -- UI Automation, `SendInput`, a test
      harness -- produces exactly that kind of event. So a chord injected by an agent reaches the
      Settings window but never produces a matching hook report, and `DEC-005`'s correlation
      resolves to `Intercepted` (an earlier third-party hook swallowed it) rather than `Received`.
    why_it_hid: >-
      Discarding injected input is correct behaviour, not a fault -- it is what stops the product
      reacting to its own synthetic events and to other software's. What was never written down is
      the consequence for verification: the one signal `DEC-005` exists to produce cannot be
      exercised by anything that is not a physical keypress. Two mandates have now run a smoke test
      over this area without it being stated.
    impact: >-
      `smoke_test: agent` cannot verify the key check's central claim, and a report saying the band
      "did not fabricate a third-party claim" is weaker than it reads: with injected input the band
      is expected to report interception, so the absence of one verdict does not confirm the
      presence of the right one. Any future run that treats an agent smoke test as covering
      `DEC-005` is claiming coverage it structurally cannot have.
    fix_direction: >-
      The seam ALREADY EXISTS and that changes the fix: `hook.rs:160-176` defines
      `accept_injected()` twice -- a constant `false` under `#[cfg(not(debug_assertions))]` so the
      branch folds away in release, and a relaxed atomic load under `#[cfg(debug_assertions)]`,
      flipped by `debug_toggle_accept_injected()`. So an agent CAN verify the key check, but only
      against a DEBUG daemon, and every smoke test so far has built release (`build.ps1 -Mode prod`).
      What to do: record the constraint where a future run meets it -- `C-KeyCheck` in
      `.how/settings/SDD-settings.md`, and the smoke script template -- and have the script build
      the daemon with `-Mode dev` for the key-check items specifically, calling
      `debug_toggle_accept_injected` first, while keeping every other item on the release binary.
      MUST NOT be resolved by making the release build accept injected input: the comment beside
      that `false` explains why the branch folds away, and the shipped keystroke path is not the
      place to add a test hook.
    owner: repo owner

  - id: DEF-13
    title: A percentage field resets to its last committed value mid-keystroke, before the user can finish typing a multi-digit number
    status: fixed
    severity: medium
    component: settings
    violates: [SPEC-4-04]
    found_in: "0.4.0"
    found_by: Owner live manual test on the current build, 2026-09-08 (post-merge of PR #19 / DEC-017 mandate, after SPEC-4-04's fix for DEF-5)
    tests:
      - shortcut_row_slint_snapshot::tests::a_multi_digit_keystroke_sequence_keeps_each_intermediate_digit_before_departure
      - shortcut_row_slint_snapshot::tests::a_real_keystroke_sequence_commits_a_typed_percentage
      - shortcut_row_slint_snapshot::tests::a_real_keystroke_sequence_out_of_range_is_refused
    fixed_in: SPEC-5-03
    fixed_by: >-
      Guarded typed_text against external sync during focus via is_editing_pct, and isolated live
      KeyCheck updates to sync_key_check in main.rs so row models are not recreated mid-typing.
    summary: >-
      The owner reports that typing a multi-digit value by hand into a Shortcuts-pane percentage field
      (`crates/settings/ui/components/shortcut_row.slint`'s `pct_input`) -- for example typing `5` then `5`
      again to reach `55` -- does not reach the second digit: the field snaps back to its last committed
      value as soon as the first digit lands, before a second keystroke can be typed. `SPEC-4-04` fixed
      `DEF-5`'s symptom of typed digits having no effect at all; this is a different symptom on the same
      control, visible only once digits DO land -- an intermediate, not-yet-complete typed value is treated
      as final and reverted rather than left alone until the field is departed.
    why_it_hid: >-
      `SPEC-4-04`'s own tests (`a_real_keystroke_sequence_commits_a_typed_percentage` and its siblings) type
      a complete valid value in one simulated sequence and then assert on departure; none of them asserts on
      the INTERMEDIATE state after only the first character of a multi-digit number, which is exactly the
      window this report describes. `pct_input`'s `edited` callback (`shortcut_row.slint`) fires on every
      keystroke and calls `root.editing_changed(...)` whenever the in-progress text already parses as a
      float -- a single digit already does -- but whether anything downstream of that per-keystroke callback
      writes back into the field before the user finishes typing is not yet established; this row does not
      name a cause it has not verified.
    impact: >-
      A user typing a two-digit (or longer) percentage by hand cannot complete the value if the field reacts
      to the first digit before the second is pressed -- the opposite of `SPEC-2-01`'s "type freetext, with
      validation" acceptance criterion, and a regression in usability even though `SPEC-4-04`'s own tests
      (which never simulate a multi-digit sequence one keystroke at a time with an assertion in between) stay
      green throughout.
    fix_direction: >-
      Root-cause with `wdi-systematic-debugging` before proposing a fix, per this repo's standing rule for a
      bug with an unknown cause -- do not guess at the `edited`/`editing_changed` interaction and patch
      blind. Whatever the cause, the fix must be provable by a test that types a multi-digit value ONE
      keystroke at a time and asserts the field still reads the partial, in-progress text after each
      keystroke before the last -- not only the fully-typed value after the whole sequence, which is what
      `SPEC-4-04`'s existing tests already cover and which must stay green and unweakened.
    owner: repo owner

  - id: DEF-14
    title: A row's hover tooltip renders as an oversized, near-transparent block that covers the row's title instead of a normal tooltip
    status: fixed
    severity: low
    component: settings
    violates: [SPEC-4-03]
    found_in: "0.4.0"
    found_by: Owner live manual test on the current build, 2026-09-08 (post-merge of PR #19 / DEC-017 mandate)
    tests:
      - shortcut_row_slint_snapshot::tests::tooltip_does_not_overlap_the_row_title
      - shortcut_row_slint_snapshot::tests::tooltip_height_fits_its_own_text
    fixed_in: SPEC-5-01
    fixed_by: >-
      Sized tooltip to tooltip_layout.preferred-height and capped width at 480px, fitting single-line
      text (~22px height) with elevated background and clear stroke.
    residual: >-
      The tooltip opens downward (y: root.height + 2px) and fits its single-line text (~22px). For a
      row at the very bottom edge of the visible scroll area, whether the tooltip clips against the
      Flickable boundary before the user scrolls is determined by the Flickable container and is out
      of reach of the testing backend (a real viewport clip cannot be observed by an automated Slint
      snapshot test). Verified manual-only in smoke test.
    summary: >-
      `SPEC-4-03` moved a shortcut row's description from a permanently visible line to a hover/focus
      tooltip, and the tooltip does appear on hover as intended. The owner reports its rendered shape is
      much taller than the one line of text it holds, and because the shape itself is near-transparent with
      only a thin outline, the extra height reads as a faint box overlapping the row's title rather than a
      normal tooltip that sits beside or above the text without touching it. Screenshot on file: the
      "Fallback switch shortcut" row's tooltip, on hover, visibly extends up into and past the row's own
      title line.
    why_it_hid: >-
      `SPEC-4-03`'s own guard
      (`shortcut_row_slint_snapshot::tests::description_renders_as_a_tooltip_not_a_visible_line`) asserts
      that the description text is absent from the always-rendered tree and present as a tooltip/accessible
      description -- it does not assert anything about the tooltip's rendered height or its position relative
      to the title, so a tooltip that exists but is oversized and misplaced still passes.
    impact: >-
      Cosmetic, but on the row the owner tested it visibly degrades readability of the row it is meant to
      describe -- the opposite of the ticket's own intent (the previous permanently-visible, truncated
      description was the problem `SPEC-4-03` set out to fix). No functional loss: the tooltip's text is
      still reachable by hover or keyboard focus.
    fix_direction: >-
      Size the tooltip to its content (or close to it) rather than to whatever default the current markup
      gives it, and position it so it does not overlap the row's title -- the owner asks that it read as
      close as practical to how a tooltip behaves in other native applications generally (appearing beside or
      just below the hovered control, close-fitted to its text, not overlapping neighbouring rows). Exact
      layout is left to the ticket; the acceptance bar is "no longer overlaps the title" plus "closely fits
      its own text," not a specific pixel size.
    owner: repo owner

  - id: DEF-16
    title: A row's hover tooltip paints behind a later sibling — the next row's controls, or the Key Check panel — instead of above them
    status: fixed
    severity: low
    component: settings
    violates: [SPEC-5-01]
    found_in: "0.5.0"
    found_by: Owner live manual retest of SPEC-5-01's fix, 2026-09-08 (post-merge of PR #20 / DEC-019 mandate)
    tests:
      - shortcut_row_slint_snapshot::tests::tooltip_paints_above_the_next_row_when_it_overflows_into_it
      - shortcuts_pane_slint_snapshot::tests::the_last_rows_tooltip_paints_above_the_key_check_panel
    fixed_in: SPEC-6-01
    fixed_by: >-
      Root-caused that Slint's `z` property only orders immediate children of the same element at compile time,
      while `PopupWindow.show()` steals keyboard focus from main window items, causing recursive focus oscillation loops.
      Fixed by moving the tooltip presentation to a dedicated window-level floating overlay in `MainWindow`'s mica content area,
      painted after `VerticalLayout` (which hosts both `ScrollView` rows and `KeyCheck`). Tooltip trigger events bubble via callbacks
      (`ShortcutRow -> ShortcutGroup -> ShortcutsPane -> MainWindow`) with viewport-relative coordinate translation,
      rendering the tooltip on top of all sibling rows and the KeyCheck panel without stealing keyboard focus or disrupting Slint's repeater.
    summary: >-
      `SPEC-5-01` fixed `DEF-14`'s oversized/transparent tooltip, but the owner's retest of the resized
      tooltip surfaces the layout question `DEF-14`'s own residual anticipated and could not settle: the
      tooltip, positioned at `x: 16px; y: root.height + 2px; z: 100` inside `ShortcutRow`
      (`crates/settings/ui/components/shortcut_row.slint:420-447`), renders BEHIND content that overflows
      into where it is drawn, in two concrete cases the owner screenshotted. (1) Hovering the title of the
      pane's last row (Overlapping Stack) draws the tooltip under the always-visible Key Check panel below
      it. (2) Hovering a row's title anywhere else draws the tooltip under the next row's own -/+ stepper,
      percentage field, and keycap button. Both are the same fault: the tooltip is a local overlay confined
      to `root`'s own stacking context, not a window-level one.
    why_it_hid: >-
      `z: 100` reads as "always on top," but a `z` value only orders an element among its OWN parent's
      children — here, `root`'s (this `ShortcutRow`'s) other children. It does nothing against a DIFFERENT
      `ShortcutRow` instance (the next row in `shortcuts_pane.slint`'s list) or the `KeyCheck` panel
      (`main_window.slint:373`), both of which are separate elements painted in the outer tree's document
      order — after this row, since they come later in it — regardless of any `z` set inside this row.
      `SPEC-5-01`'s own guards (`tooltip_does_not_overlap_the_row_title`,
      `tooltip_height_fits_its_own_text`) check the tooltip's geometry against its OWN row's title, which is
      correct for what they test, but neither renders a second row or the Key Check panel to see either
      paint-order collision — `DEF-14`'s residual named the adjacent risk ("clips against the Flickable
      boundary") but that is a viewport-clip concern, a different failure from a same-viewport element
      painting on top of a fully-visible tooltip, which is what the owner actually found.
    impact: >-
      The tooltip becomes unreadable exactly when it collides with something else on screen, which is the
      case the pane's own density (five stacked groups, a docked Key Check band) makes common rather than
      rare — the owner reproduced it on the very last row and on an ordinary row, not an edge case. No
      functional loss: the description is still reachable via the same hover/focus and via the accessible
      description on the title element.
    fix_direction: >-
      The tooltip needs a window-level (or pane-level) overlay layer that paints above every `ShortcutRow`
      and above `KeyCheck`, not a `Rectangle` scoped inside the hovered row — Slint's own `PopupWindow`
      exists for exactly this shape (anchored to a parent element, rendered in its own top-level layer) and
      is worth root-causing as the fix before inventing a hand-rolled overlay, per this repo's standing rule
      against patching blind. Whatever the mechanism, it MUST be provable by a test that renders at least
      two adjacent rows (or a row plus `KeyCheck`) together and asserts the tooltip's bounds are the
      topmost element at its own pixel region, not merely non-overlapping with its own row's title — the
      gap `SPEC-5-01`'s two guards left. Do not reopen `DEF-14`/`SPEC-5-01`'s tests to make room for this;
      they check a real, narrower property and stay green and unweakened.
    owner: repo owner

  - id: DEF-17
    title: Typing a percentage past its boundary freezes both stepper buttons on that row
    status: fixed
    severity: medium
    component: settings
    violates: [SPEC-2-01, SPEC-5-03]
    found_in: "0.5.0"
    found_by: Owner live manual retest of SPEC-5-03's fix, 2026-09-08 (post-merge of PR #20 / DEC-019 mandate)
    tests:
      - shortcut_row_slint_snapshot::tests::stepper_recovers_from_an_above_max_typed_value
      - shortcut_row_slint_snapshot::tests::stepper_recovers_from_a_below_min_typed_value
      - shortcut_row_slint_snapshot::tests::stack_row_stepper_recovers_from_an_out_of_range_typed_value
      - shortcut_row_slint_snapshot::tests::a_real_keystroke_sequence_commits_a_typed_percentage
      - shortcut_row_slint_snapshot::tests::a_multi_digit_keystroke_sequence_keeps_each_intermediate_digit_before_departure
    fixed_in: SPEC-6-02
    fixed_by: >-
      Updated `step_plus` and `step_minus` in `crates/settings/ui/components/shortcut_row.slint` to clamp `raw` value into
      `[percent_min, percent_max]`. On an above-max typed value (e.g. 101 for a 1-99 row, or 150 for 10-100 stack), clicking `-`
      steps down directly to `percent_max` (recovering from frozen state), and `+` stays clamped at `percent_max`. On a below-min
      typed value (e.g. 0 for 1-99, or 5 for 10-100), clicking `+` steps up directly to `percent_min`, and `-` stays clamped at
      `percent_min`. Tested symmetrically for both above-max and below-min bounds across both the 1-99 snap family and the 10-100 stack family.
    summary: >-
      The owner reports that typing a value past a percentage field's own bound (e.g. `101` where the
      bound is 1-99) is accepted into the field as free text, exactly as `SPEC-5-03` intended so a
      multi-digit value can be finished — but once the field holds that out-of-range value, BOTH the `-`
      and `+` stepper buttons on that row stop responding to clicks. Save-time validation already refuses
      the out-of-range value correctly, per the owner's own confirmation; only the live stepper buttons are
      affected.
    why_it_hid: >-
      Root-caused directly against `crates/settings/ui/components/shortcut_row.slint`'s `step_plus`
      (line 67) and `step_minus` (line 74): both read `let base = root.current_value()` and only move by
      one when a boundary guard holds — `step_plus`'s is `base >= percent_min && base < percent_max`,
      `step_minus`'s is `base > percent_min && base <= percent_max` — and set `next = base` (i.e. UNCHANGED)
      whenever the guard is false. Both guards assume `base` is already inside `[percent_min, percent_max]`,
      which held when the only way to change a row's value was through these same two buttons. `SPEC-4-04`
      and `SPEC-5-03` deliberately let free-typed text past that boundary sit in `typed_text` uncommitted
      (checked: `app.rs::set_percent`, line 981, stores whatever value is passed with no clamping, so an
      out-of-range value is not even corrected once committed) — so `current_value()` can now legitimately
      return 101, and at 101 neither guard is ever true again: `step_minus`'s `101 <= percent_max(99)` is
      false, so decrementing is refused exactly as incrementing is, and the row is stuck until something
      else overwrites `typed_text` (a `percent`/`revert_generation` change from outside the row).
    impact: >-
      A user who overshoots while typing — the exact scenario `SPEC-5-03` was written to make possible —
      loses both stepper buttons on that row until they either retype a valid value by hand or trigger an
      external resync (Revert, or switching panes and back). The field's own text does not visibly explain
      why the buttons stopped working, so the row reads as broken rather than as "waiting for a valid
      value."
    fix_direction: >-
      Clamp `base` into `[percent_min, percent_max]` before applying the guard, rather than assuming it is
      already there — e.g. a value above `percent_max` steps DOWN to `percent_max` on the next `-` press
      (and stays refused on `+`, correctly), and symmetrically below `percent_min`. The fix must be provable
      by a test that types an out-of-range value (both above max and below min, per this repo's own
      standing rule to cover a genuine boundary rather than one side of it) and then clicks each stepper
      button, asserting the row recovers a value inside bounds rather than staying frozen. `SPEC-5-03`'s own
      tests (multi-digit keystroke retention, valid-value commit, out-of-range-is-refused-at-save) must stay
      green and unweakened — this defect is about the STEPPER buttons, not the typed-text or save-time
      paths those already cover.
    owner: repo owner

  - id: DEF-15
    title: A row's container grows and shrinks noticeably when its toggle is switched off and on, because of the "Disabled" caption's own height rather than a fixed row height
    status: fixed
    severity: low
    component: settings
    violates: [SPEC-4-03]
    found_in: "0.4.0"
    found_by: Owner live manual test on the current build, 2026-09-08 (post-merge of PR #19 / DEC-017 mandate)
    tests:
      - shortcut_row_slint_snapshot::tests::row_height_is_identical_toggle_on_and_toggle_off
    fixed_in: SPEC-5-02
    fixed_by: >-
      Held ShortcutRow container at min-height 53px, keeping keycap pitch constant at 54.0px in both
      toggle-on and toggle-off states.
    summary: >-
      Switching a shortcut row's toggle off shows a "Disabled" caption under the row's title, which is
      wanted, but the row's own container grows taller to fit it and shrinks back when the toggle is
      switched back on -- so every row's height changes depending on its own toggle state, rather than
      staying constant. Screenshot on file: the same "Switching" group shown toggle-on (compact row height)
      and toggle-off (visibly taller rows, extra space below the "Disabled" caption before the row ends).
    why_it_hid: >-
      No test in `SPEC-4-03` asserts row height while toggling a row off — its own
      `row_height_is_independent_of_description_length` guard is about description length at a FIXED toggle
      state, not about height across the two toggle states.
    impact: >-
      Cosmetic. Toggling any one row off shifts the vertical position of every row below it in the same
      group, which the owner finds visually inconsistent rather than broken.
    fix_direction: >-
      An idea from the owner, offered as a direction rather than a decided design: give the row a little more
      base height than its current toggle-on height, calling it done at a height that comfortably fits
      "Disabled" close against the row's lower edge without growing further when the caption appears -- so the
      container is the same height in both states, and the caption's appearance/disappearance is what
      changes, not the row's own height. The builder is free to land on a different concrete height as long
      as the row height is IDENTICAL toggle-on vs toggle-off; a new test asserting that equality is the
      acceptance bar, not any specific pixel value. Sequenced with `DEF-14` since both touch the same row
      markup `SPEC-4-03` last touched.
    owner: repo owner

  - id: DEF-18
    title: An out-of-range typed percentage commits to the draft on Enter/blur, instead of reverting to the previous value
    status: fixed
    severity: low
    component: settings
    violates: [SPEC-2-01, SPEC-6-02]
    found_in: "0.5.0"
    found_by: Owner live manual retest of SPEC-6-02's fix, 2026-09-08 (post-merge of PR #21 / SPEC-6 closure)
    tests:
      - shortcut_row_slint_snapshot::tests::typed_percentage_above_max_reverts_on_enter
      - shortcut_row_slint_snapshot::tests::typed_percentage_below_min_reverts_on_enter
      - shortcut_row_slint_snapshot::tests::typed_percentage_out_of_range_reverts_on_blur
      - shortcut_row_slint_snapshot::tests::stack_row_typed_percentage_out_of_range_reverts_on_enter
    fixed_in: SPEC-7-01
    fixed_by: >-
      Centralized field departure handling into `commit_departure` in `crates/settings/ui/components/shortcut_row.slint`,
      enforcing `val >= root.percent_min && val <= root.percent_max` on Enter (`accepted`), blur (`changed has-focus`),
      and Tab navigation (`key-pressed`). Out-of-range values reset `typed_text` to `root.percent`, suppress `percent_changed`,
      and synchronize `editing_changed(root.percent)`. In `crates/settings/src/main.rs`, guarded cross-row departures in
      `on_pane_selected`, `on_start_capture`, `on_swap_shortcuts`, and `on_percent_changed` against applying out-of-range percentages
      to the model draft. Covered by 4 snapshot tests across both bound families (1-99 snap and 10-100 stack).
    summary: >-
      `SPEC-6-02` fixed `DEF-17` so the stepper buttons recover a row's value once it holds an
      out-of-range typed number. The owner's follow-up manual test asks for a second recovery path:
      typing a value past a percentage field's own bound (e.g. `101` where the bound is 1-99), then
      pressing Enter, clicking away, or tabbing off the field, commits that out-of-range value into the
      in-memory draft exactly as a valid value would -- it is refused only later, at save. The owner
      wants this departure to behave as if no change had been made at all: the field should revert
      immediately to the row's previous value on Enter, on blur (mouse leaving the field / losing
      focus), the same way an unparseable value already reverts today.
    why_it_hid: >-
      `SPEC-2-01` built commit-on-departure and `SPEC-4-04`/`SPEC-5-03` deliberately let free-typed text
      past a field's bound sit in `typed_text` uncommitted so a multi-digit value can be typed to
      completion -- but none of the three departure paths in
      `crates/settings/ui/components/shortcut_row.slint` (`accepted`, `changed has-focus`, `key-pressed`
      Tab/Backtab) ever compares the parsed value against `percent_min`/`percent_max` before firing
      `percent_changed`; they only fall back to the previous value when the text fails to parse as a
      number AT ALL. `Settings::set_percent` (`crates/settings/src/app.rs:981`) then stores whatever
      value it receives into the draft with no clamping. `DEF-17`'s own investigation of this exact
      neighborhood stopped at the STEPPER buttons' boundary guards, because that is what the owner
      reported at the time; the departure paths were never in that ticket's scope.
    impact: >-
      Low. Save-time validation still refuses the out-of-range value (`SPEC-2-01`), so nothing invalid
      reaches disk. Between departure and save, though, the draft (and the visible field) sits holding a
      value the product already knows it will refuse, which is confusing state to carry and one save
      attempt away from surfacing as a rejection the owner did not expect from a field that looked
      accepted.
    fix_direction: >-
      Add the same bounds check to all three departure call sites named above: if the parsed value is
      inside `[percent_min, percent_max]`, keep the current commit behavior unchanged; if it is outside
      that range, do not fire `percent_changed` at all and instead reset `typed_text` to the row's
      current `percent`, the same recovery `SPEC-6-02` already gives the stepper path. Test both
      directions (above-max, below-min) and both bound families (the 1-99 snap rows and the 10-100 Stack
      row), and both departure triggers (Enter, blur) rather than only the one the owner happened to
      type -- `DEF-17`'s own precedent is the reason this ticket asks for that symmetry up front.
    owner: repo owner
