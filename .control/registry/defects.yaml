# defects.yaml — SSOT for defects: ordinary bugs and hotfixes.

defects:
  - id: DEF-5
    title: Typing a digit by hand into a percentage field does not reach the value the stepper buttons read
    status: open
    severity: medium
    component: settings
    violates: [SPEC-2-01]
    found_in: "0.4.0"
    found_by: Owner live manual test on the elevated build, 2026-09-07 (post-DEC-016 finish, pre-merge of PR #17)
    tests: []
    summary: >-
      The owner reports that on the live standalone build, typing a number directly into a Shortcuts-pane
      percentage field (`crates/settings/ui/components/shortcut_row.slint`'s `pct_input`) has no visible
      effect -- only the `+`/`-` stepper buttons change the value. Every existing automated test for
      `SPEC-2-01`'s commit-on-departure behaviour (`typed_percentage_commits_on_save_click` and its four
      siblings in `shortcut_row_slint_snapshot.rs`) drives the field through
      `ElementHandle::set_accessible_value`, i.e. the UI Automation `RangeValuePattern` /
      `accessible-action-set-value` path -- not through simulated character key presses reaching the
      `TextInput`'s native text-entry handling. Those tests prove the commit-on-departure LOGIC is correct
      once a value lands in `root.typed_text`; they do not prove a physical keystroke gets a digit into
      `typed_text` in the first place. The two paths are different code, and only one of them has ever
      been exercised by a test or by automation (the live smoke test in `.scratch/live-test-dec-016.md`
      hit the same live standalone binary and independently could not drive real keyboard input into this
      window either, for an unrelated automation-side reason -- `SetForegroundWindow` refused to a
      background process -- which is not this defect, but left this exact path untested from both sides
      until the owner tried it by hand).
    why_it_hid: >-
      Every seam this feature was tested at (`shortcut_row_slint_snapshot.rs`, `layout_pane_slint_snapshot.rs`)
      drives values in through the accessible-value setter because that is the only reliable way to script
      a Slint `TextInput` from a `#[test]`. Nothing in the suite types a character and checks it landed.
      `pct_input`'s own `key-pressed` handler only special-cases `Tab`/`Backtab`; ordinary character keys
      fall through to Slint's built-in `TextInput` editing, which was never separately asserted on.
    impact: >-
      A user who tries to type "68" into a snap-percentage or (once `DEC-014` ships) the Overlapping Stack
      width field, expecting free-text entry, sees nothing happen and has to discover the stepper buttons
      instead -- the opposite of what `SPEC-2-01`'s own acceptance criteria promised ("should be able to
      type freetext, with validation"). Whether this is `input-type: number` narrowing accepted characters,
      a focus/z-order gap between `pct_field_touch`'s `TouchArea` and the `TextInput` beneath it, or
      something else entirely is not yet known -- this row is deliberately not naming a root cause it
      has not verified.
    fix_direction: >-
      Root-cause with `wdi-systematic-debugging` before proposing a fix, per this repo's own standing rule
      for any bug with an unknown cause -- do not guess at `input-type` or focus/z-order and patch blind.
      Whatever the cause, the fix MUST be provable by a test that drives the field the way this one wasn't:
      a real simulated key-press sequence (not `set_accessible_value`) that types digits and asserts they
      land in `typed_text`/commit, in addition to the existing accessible-value tests, which stay -- they
      cover the automation/assistive-technology path and MUST NOT be weakened to make room for the new one.
    owner: repo owner
    title: Two hook tests depend on the live desktop and fail with no foreground window
    status: fixed
    severity: high
    component: window-management
    violates: [NFR-4]
    found_in: "0.1.0"
    found_by: W1 verification wave, 2026-08-21
    tests:
      - hook::tests::win_up_passes_through_after_win_shortcut
      - hook::tests::win_up_not_suppressed_for_alt_fallback
    summary: >-
      `handle_key_event` asks the OS whether the foreground window is a VM or RDP client the
      moment a chord matches, and correctly so -- in production that question can only be
      answered live. But it reaches `GetForegroundWindow` through
      `vm_bypass::evaluate_foreground`, and the two tests above call `handle_key_event`
      directly. When the calling process has no resolvable foreground window,
      `HookIdentityCollector::collect` returns `WideIdentity::default()`,
      `classify_wide` returns `Passthrough(BypassReason::IdentityUnavailable)` -- failing open,
      by design -- and the matched chord returns `PassToNext`. The assertion expects `Swallow`,
      and the observed failure is exactly `left: PassToNext, right: Swallow`.
    why_it_hid: >-
      The sibling test `hook::tests::no_modifier_release_is_ever_swallowed` walks the same key
      sequence and passes, because it discards the backtick dispositions with `let _ =` and
      asserts only the modifier release. So the strongest-looking guard on this behaviour is
      the one that cannot catch this, and the suite looks healthier than it is.
    impact: >-
      The suite is not deterministic: it passes when the test process can resolve a foreground
      window and fails when it cannot. CI runs `cargo test --workspace --locked` on
      `windows-latest`, where a job has no interactive desktop, so these two are expected to
      fail there every run. The product code is NOT at fault -- asking the OS live is the
      correct production behaviour, and the VM/RDP passthrough it guards is deliberate.
    fix_direction: >-
      Give `handle_key_event` a seam for the bypass decision, as it already has one for
      `BypassPolicy`, so a unit test supplies the identity instead of the desktop. MUST NOT be
      fixed by weakening or deleting the assertions: they guard the sticky-modifier bug, where
      a swallowed Win key-up left the focused application treating every later keystroke as
      Win+key.
    owner: repo owner
    fixed_in: W1
    fixed_by: >-
      `handle_key_event` split into a thin wrapper plus
      `handle_key_event_with_bypass`, which takes the bypass check as an
      `FnOnce(&mut HookRuntime) -> bool`. A closure rather than a `bool` on purpose: the live
      Win32 query must stay lazy so it still runs only after a chord matches, never on every
      keystroke. Production behaviour is unchanged -- the wrapper supplies the real
      `evaluate_foreground` call -- and the two tests supply `|_| false`. Every assertion and
      expected value is unchanged. Verified: `cargo test --workspace` exits 0, 330 passing;
      clippy clean under `-D warnings`.
    residual: >-
      `hook::tests::no_modifier_release_is_ever_swallowed` still calls the live
      `handle_key_event`, so it still queries the desktop. Its assertion holds on both branches
      -- a bypassed chord never sets `swallow_release_vk`, so the modifier release passes
      through either way -- which means it would also pass if the bypass swallowed everything.
      That is the shape `docs/decisions.md` warns about: a test that can pass for the wrong
      reason. Now routed through the same seam, so all three tests supply the bypass decision
      explicitly and none of them reads the desktop. Assertion and failure message unchanged.


  - id: DEF-6
    title: All four custom-percentage rows announce the same accessible name
    status: open
    severity: low
    component: settings
    violates: [FR-20, FR-21]
    found_in: "0.4.0"
    found_by: Standards-axis review of SPEC-4-02, 2026-09-07 (pre-existing, not introduced by it)
    tests: []
    summary: >-
      `SnapPercentLeft`, `SnapPercentRight`, `SnapPercentTop` and `SnapPercentBottom` each render
      the same four accessible names — "Decrease snap percentage", "Snap percentage field",
      "Snap percentage input", "Increase snap percentage". A screen-reader user moving through the
      Shortcuts pane therefore cannot tell the left-edge percentage control from the top-edge one:
      four focusable controls, one name each, repeated four times over.
    why_it_hid: >-
      The retired `layout_pane.slint` conditional produced exactly the same strings, so nothing
      changed when `SPEC-4-02` moved them into declared `theme.rs` vocabulary. And
      `theme::tests::accessible_names_are_unique` compares the CONSTANTS to each other, where each
      name appears once and is genuinely unique. The duplication is in the RENDERED tree, across
      rows, which that guard does not look at. `DEF-2` was the same class of fault — two focusable
      controls sharing a name — caught then because both controls sat in one pane.
    impact: >-
      Accessibility only; no functional defect and nothing is mis-saved. The four rows are still
      distinguishable by their row title, which a screen reader reads, so this degrades navigation
      rather than blocking it — which is why it is `low` and not the severity `DEF-2` carried.
    fix_direction: >-
      Per-direction names, e.g. "Left edge percentage input", rather than one shared set for the
      family. That needs a `ShortcutField`-keyed label set rather than the two-family split
      `SPEC-4-02` introduced, so it is a design change and belongs to its own ticket rather than
      to `SPEC-4`, whose remaining two tickets are both already scope-guarded against it.
    owner: repo owner

  - id: DEF-2
    title: Two focusable controls share the accessible name "Stack width percent"
    status: fixed
    severity: low
    component: settings
    violates: [FR-20]
    found_in: "0.1.0"
    found_by: RISK-3 accessibility re-verification on eframe 0.36.1, 2026-08-22
    tests:
      - theme::tests::accessible_names_are_unique
      - app::tests::focus_order_has_no_duplicates
      - app::tests::focus_order_is_stable_across_calls
      - app::tests::focus_order_starts_with_navigation_and_ends_with_actions
    # `SPEC-4-02` retired the Layout pane, and with it `focus_order(Pane::Layout)` — the one
    # production reader of `theme.rs`'s three `STACK_WIDTH_*` names. The three `focus_order_*`
    # guards above therefore no longer touch these controls at all, and
    # `accessible_names_are_unique` iterates constants the UI no longer draws. The stack-width
    # controls DO still carry three distinct accessible names on their new Overlapping Stack row,
    # so this defect's symptom has not returned — but its named guards stopped covering it, which
    # is recorded here rather than left for a future reader to discover. `SPEC-4-02`'s return trip
    # re-points the markup at those constants and adds the guard that makes this row true again.
    summary: >-
      `focus_order(Pane::Layout)` declares "Stack width percent" as ONE focus stop, but the
      published UI Automation tree carries two focusable controls with that identical name --
      a `Slider` (`range=50[10..100]`) and a `Spinner` (`value='50'`, `range=50[10..100]`) --
      plus a static `Text` with the same string. A Tab walk of the Layout pane therefore lands
      nine times, not eight, and a screen reader announces the same name twice with nothing to
      distinguish the slider from the spin box.
    why_it_hid: >-
      `focus_order_mismatch` compares the declaration against the stops the RENDERER reports it
      drew, not against the UIA tree. The renderer reports one stop for the widget, so the
      declaration and the renderer agree with each other and the assertion passes -- while
      neither matches what assistive technology actually sees. This is the exact blind spot
      RISK-3 named: `app::tests::focus_order_*` proves the declared focus order, not the tree.
    impact: >-
      Minor. Both stops are reachable, correctly named, and expose their value and range, so no
      control is unreachable or silent -- FR-21 is unaffected. What suffers is FR-20's
      "Tab order follows intuitive visual flow": one logical field costs two Tab presses and
      announces one name twice.
    owner: repo owner
    fixed_in: main
    fixed_by: >-
      Split into distinct accessible semantics in `crates/settings/src/theme.rs` (`STACK_WIDTH_SLIDER`
      and `STACK_WIDTH_INPUT`). `crates/settings/src/main.rs` binds the slider text to
      `STACK_WIDTH_SLIDER.name` and records both stops into drawn list; `crates/settings/src/app.rs`
      declares both in `focus_order(Pane::Layout)`. Uniqueness and focus-stop order verified by
      unit tests and full workspace test run.

  - id: DEF-3
    title: The shortcut capture lease can never arm — Settings sends a PID where the daemon reads an HWND
    status: fixed
    severity: high
    component: settings
    root_cause: architecture
    violates: [UC-4, FR-7]
    decision: DEC-004
    found_in: "unreleased"
    found_by: Capture-lease scope consultation, 2026-08-26
    summary: >-
      Three places describe `WM_APP_CAPTURE_LEASE`'s `lParam` and two of them disagree.
      `crates/shared/src/constants.rs:141,145` -- the contract, and the SSOT -- says
      `lParam` = Settings window HWND. `crates/settings/src/persistence.rs:176` sends
      `std::process::id()`, a PID, and its own SAFETY comment says so.
      `crates/daemon/src/tray.rs:399-406` reads the value as an HWND and calls
      `GetWindowThreadProcessId` on it to derive a PID. That call fails for a value that is
      not a window handle and leaves its out-parameter untouched, so `pid` stays 0;
      `crates/daemon/src/hook.rs:883` stores 0, and the guard at `:274`
      (`rt.capture_lease_pid != 0`) then makes the whole branch unreachable. The lease has
      never once armed. In the improbable case where a PID value collides with a live HWND,
      the daemon derives some unrelated process's PID instead, which is not better -- it is
      the same failure with a worse shape.
    why_it_hid: >-
      Three things, and the first is the one worth remembering. (1) The SSOT is on the wrong
      side: because `constants.rs` says HWND, `tray.rs` is correct against the contract and
      `persistence.rs` is the violator -- so a review that reads either side against the
      contract confirms that side. The fix therefore has to change the contract, not just
      code. (2) No test touches it. `capture_lease_pid` appears only in two `HookRuntime`
      initialisers, both 0, and the branch is unreachable from a test by construction: it
      calls `rt.identity.foreground_pid()` directly, which is `GetForegroundWindow` at
      `crates/daemon/src/context/vm_bypass.rs:119`, and a test harness with no foreground
      window returns 0 while the guard demands non-zero. This is DEF-1's failure repeating
      one branch earlier -- the lease check sits ABOVE the `handle_key_event_with_bypass`
      seam DEF-1 introduced, so it never benefits from it. (3) The debug trace misleads:
      `hook.rs:886` prints `HOOK_LEASE: arm=true pid=0`, and 0 is indistinguishable from a
      disarm, so a reader of the log blames Settings for not sending.
    impact: >-
      UC-4's recording step cannot work for any chord that is already one of the six
      configured shortcuts: the daemon claims its own chord while Settings is trying to
      re-record it, so the window switches and Settings loses the foreground. This is the
      reported symptom. It also blocks the observe lease `DEC-004` and `DEC-005` are built
      on, because both read the same PID comparison. Not yet shipped -- none of the lease
      code is in `HEAD`; it is uncommitted work in the working tree, which is why this row
      is a finding about unfinished work rather than a regression against a release.
    fix: >-
      Not `fastpath`. Gated on `DEC-004` reaching `accepted` -- the wave that carries it does
      not exist yet, so no wave id can honestly be named here.
    fix_direction: >-
      Carry the PID and delete the HWND conversion, correcting `constants.rs` in the same
      change so the contract stops sanctioning the wrong shape: the hook compares against a
      PID, `std::process::id()` cannot fail, and a PID is inert data where a cross-process
      HWND is a handle whose validity the sender cannot guarantee. Encode the lease level in
      `wParam` (0 none, 1 observe, 2 record) rather than adding a second message or a second
      boolean. MUST NOT be closed by fixing only `persistence.rs`: that leaves the contract
      saying HWND, and the next reader restores the bug. The lease decision MUST also move
      behind a seam of the shape DEF-1 established, so a test can supply the foreground
      identity instead of the desktop -- an untestable branch is what let this ship as far
      as it did.
    owner: repo owner
    fixed_in: unreleased
    fixed_by: >-
      `crates/shared/src/constants.rs` corrected first: `WM_APP_CAPTURE_LEASE` /
      `WM_APP_HOOK_LEASE` now document `wParam` as the lease level
      (`CAPTURE_LEASE_NONE`/`_OBSERVE`/`_RECORD`) and `lParam` as the Settings
      process id -- never an HWND. `crates/daemon/src/tray.rs` forwards the pid
      unchanged and deletes the `GetWindowThreadProcessId` conversion entirely.
      `crates/daemon/src/hook.rs` stores level and pid together
      (`HookRuntime::capture_lease_level`/`capture_lease_pid`), decides the
      lease through a new pure `lease_action` seam that takes the foreground
      lookup as a lazy closure (the same shape `DEF-1` established one branch
      lower), and the comparison now runs before `match_shortcut` so an
      unconfigured chord such as `Win+1` reaches it -- the fix for the actual
      reported symptom. A dead lease holder is reaped on the existing
      heartbeat (`OQ-17`), never inside the callback.
      Verified: `hook::tests::record_lease_swallows_an_unconfigured_chord_before_match_shortcut`
      seen failing -- reverted the reordering, watched it fail with
      `left: PassToNext, right: Swallow`, restored the fix, watched it pass.
      `cargo test --workspace` (`WIRADESK_SKIP_MANIFEST=1`) exits 0, 366
      passing across `daemon`/`settings`/`shared`; `cargo clippy --workspace
      --all-targets -- -D warnings` clean; `cargo fmt --all -- --check` clean.
    residual: >-
      Addressing by pid still carries `OQ-17`'s pid-reuse window between an
      exit and the next heartbeat tick; disarm-on-every-exit-path plus
      heartbeat reaping narrows it, and it is carried as a known residual
      rather than described as closed.

  - id: DEF-4
    title: KeyCheckVerdict::Intercepted is declared but never constructed — a chord swallowed by another hook reads as "Daemon Not Running"
    status: fixed
    severity: low
    component: settings
    root_cause: incomplete implementation
    violates: [DEC-005]
    found_in: "0.4.0"
    found_by: >-
      wdi-reconcile code-vs-doc trace, 2026-09-03; confirmed as a real gap rather than an
      accepted simplification by the product owner the same day (`OQ-36`).
    summary: >-
      `DEC-005` and `KeyCheckVerdict` (`crates/settings/src/app.rs`) declare four outcomes for
      the Key Check pane. `record_key` only ever produces three: `Received` (hook and window
      both correlate), `ClaimedByOtherApp` (window event arrived, no correlating hook report,
      within a grace timeout), and `DaemonNotRunning` — assigned identically whether the daemon
      is genuinely absent, or the daemon is running but no hook report ever correlates because
      an earlier third-party keyboard hook swallowed the chord before Wira Desk's own hook saw
      it. `KeyCheckVerdict::Intercepted`, meant for exactly that second case, is declared with a
      doc comment ("Intercepted by external LL hook / swallowed, chord dead") and never
      constructed by any code path.
    impact: >-
      A user whose daemon is running normally, testing a chord that another running program's
      keyboard hook consumes first, is told "Daemon Not Running" — the wrong diagnosis. The
      correct fix is local: it points them at restarting a daemon that was never the problem,
      rather than at the actual external hook. No keystrokes or shortcuts are lost; this is a
      diagnostic-message defect, not a functional one, which is why severity is low despite the
      wrong-diagnosis cost.
    fix_direction: >-
      In `record_key`, when `daemon_running` is true and no hook report correlates within the
      observation window, construct `Intercepted` instead of reusing `DaemonNotRunning`. The
      `daemon_running` flag already distinguishes the two root causes; the fix is using it on
      this branch rather than only on the true-absence branch. `DEC-005`'s own boundary
      paragraph in `SDD-settings.md` already states the honest-silence stance this closes one
      more gap in — no design change needed, only wiring the fourth outcome the decision
      already named.
    owner: repo owner
    fixed_in: fastpath (no FR/UC/AD-N/domain-model touched, one ticket, no third party)
    fixed_by: >-
      `crates/settings/src/app.rs::record_key` — the branch that reused `DaemonNotRunning` for
      "daemon running, nothing correlated" now constructs `KeyCheckVerdict::Intercepted`
      instead, matching the row `DEC-005`'s table and the enum's own doc comment already named.
      The pre-existing test `a_window_event_with_no_hook_report_reports_daemon_not_running` was
      itself asserting the bug (it passed `daemon_running: true` and expected
      `DaemonNotRunning`); renamed to
      `a_window_event_with_no_hook_report_while_the_daemon_runs_reports_intercepted` and its
      assertion corrected. Added
      `a_window_event_with_the_daemon_absent_reports_daemon_not_running`
      (`daemon_running: false`) — the genuine daemon-absent path had no test at all before this.
      Verified: the renamed test seen failing first (`left: DaemonNotRunning, right:
      Intercepted`) before the fix, green after. `cargo test --workspace`
      (`WIRADESK_SKIP_MANIFEST=1`) exits 0, 491 passing across `daemon`/`settings`/`shared`;
      `cargo clippy --workspace --all-targets -- -D warnings` clean; `cargo fmt --all` clean.
