    # (2026-09-07) are now the first specs to touch `settings` under the flat shape regardless, so that
    # avoidance no longer avoids anything — S4-S6 backfilled here for the same honest reason S1-S3 were:
    # they are real, already-`done` stories, not fabricated to close a gap. UC-8 stays unscheduled
