# specs.yaml — the work plan.
#
# Renamed from waves.yaml. Its top-level key was `waves:`; the validator reads `specs:`
# (`rows(self.specs, "specs")`), which meant every closed W1-W4 wave below was invisible to
# validate.py (uc-scheduled's "no spec yet" was true only because nothing here was read at all,
# not because the product had none). Key renamed to `specs:` while opening SPEC-1 — the first
# spec to use it, per wdi-upgrade's finding that this file's re-cut is wdi-build's, not a hand
# edit. The W1-W4 entries are frozen records and are otherwise untouched: their `id: W<N>` stays
# a retired alias (wdi-build's own Phase 1 rule), and their `epics`/`stories` nesting stays as
# history — only a new spec uses the flat `tickets:` shape.
#
# `release` MUST be named on every spec. TICKET STATUS MUST NOT BE COPIED HERE — it is read from
# ticket-file frontmatter/body when `.control/generated/` regenerates (`ticket-status-one-home`).

specs:
  - id: W1
    release: "0.1.0"
    prd: [wira-desk]
    size: M
    status: closed
    # Phase 4 complete, in order. Registry catch-up: 7 LCs registered, no `touches` recorded so
    # none to resolve. Inventories: readers written for this stack and run; the 32 reported gaps
    # are one structural finding, not 32 drifts -- the three artefacts carry no `## Rows` section,
    # so the engine had no plan to compare against. Left for `wdi-blueprint`, which owns them;
    # the engine forbids patching it by hand. Distillation: the three
    # `.constitution/project/codebase-*-guide.md` filled from the code at 67f2645 and raised to
    # Accepted. Retrospective: size M, advisory -- skipped, stated rather than silent.
    #
    # Closed only after the suite went green. It was reopened once on DEF-1, because SPEC.md
    # forbids closing a verification wave on a red suite and that rule binds the session that
    # wrote it. DEF-1 is now `fixed` and `cargo test --workspace` exits 0 with 330 passing.
    # RTM: 14/14 green, promise progress 100%.
    depends_on: []
    spec_folder: .scratch/w1-verify-0-1-0/
    spec_reviewed:
      date: '2026-08-21'
      sha: '7a0d260'
      lenses: [structure, prose, edge-case-hunter]
    fr: [FR-1, FR-2, FR-3, FR-4, FR-5, FR-6, FR-7, FR-10, FR-11, FR-12, FR-13, FR-14, FR-17, FR-18]
