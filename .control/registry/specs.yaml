    # all 6 stories now, not a fabricated stamp: it found one genuine gap (UC-7's Alternate/Failure
    # Flows never distinguished monitor-move's "refuse rather than invent a minimum size" behavior
    # from half-snap's "respect the window's own minimum size", though the code — verified in
    # `arrangement/monitor.rs` — has always drawn that line) — fixed directly in
    # UC-7-move-window-next-monitor.md and LC-arrangement-engine.md, code being ground truth here.
    # `tickets:` carries ONLY S3 (the one satisfying UC-7); S1/S4/S5 satisfy no UC and S2's UC-2 is
    # already scheduled via W1-S2, so nothing else was needed. S6 (settings) deliberately excluded —
    # same reasoning as W1: adding it would mark `settings` touched and newly redden UC-5/UC-6/UC-8.
    spec_reviewed:
      date: '2026-09-06'
      sha: 'b0dea3e'
      lenses: [edge-case-hunter]
    tickets:
      - id: W4-S3
        component: window-management
        satisfies: [UC-7]
        tests: [arrangement::monitor::tests::single_monitor_yields_an_empty_plan, arrangement::monitor::tests::next_monitor_wraps_from_last_to_first, arrangement::monitor::tests::a_left_half_stays_a_left_half_across_monitors, arrangement::monitor::tests::proportional_mapping_survives_a_resolution_difference, arrangement::monitor::tests::empty_destination_work_area_is_rejected]
    # Closed 2026-08-26. All six stories landed, each green on fmt + clippy -D warnings +
    # the full suite; 391 tests at the start of the wave, 438 at the end.
    #
    # Two deviations from the delivery method, both the owner's explicit instruction and
    # recorded rather than hidden:
    #   - No isolated worktree. wdi-build's precondition requires one; the owner redirected
    #     the wave to the main checkout on `main` after the first worker had been dispatched.
    #     The worker was stopped before it produced anything and its worktree removed.
    #   - No dispatched workers and no code-review panel. The orchestrator wrote the code
    #     itself, so the five-step per-story pipeline (plan / build / panel / publish / CI)
    #     did not run. Cross-model review independence was not obtained for this wave.
    #
    # A second session committed to `main` during the wave (d69cfd2, Settings window
    # centring). No file overlapped; verified rather than assumed.
    #
    # Retrospective: size M, advisory under V19. Skipped, stated rather than silent.
    #
    # Inventories re-derived from code at close: 3 plan-versus-code findings, all
    # pre-existing (WM_APP_CAPTURE_LEASE, WM_APP_HOOK_LEASE, WM_APP_RECORDED_CHORD absent
    # from inventory-api.md since the DEC-004/005 work). Routed to wdi-blueprint, which owns
    # that artefact; not patched from this side. Structure maps needed no refresh — the wave
    # added one file inside an existing crate and no base folder.
    depends_on: [W3]
    spec_folder: .scratch/w4-arrangement/
    fr: [FR-14, FR-15, FR-22, FR-23]
    # Corpus for this wave landed at 79277c2 and its review traces at d36463a.
    # Stories are deliberately serial: five of the six touch `daemon/src/hook.rs`,
    # so parallel worktrees would collide on the one file every arrangement
    # command passes through. S1 is the blocker run alone first, per the
    # preferred pattern — its shape decision (the `Chords` struct) is what the
    # other five build on.
    epics:
      - id: E1
        title: The arrangement command set grows to nine actions without renumbering what is already queued
        stories:
          - id: S1
            title: Chord configuration travels as one struct, so adding an action is one line rather than five call sites
            spec_folder: .scratch/w4-arrangement/
            component: window-management
            satisfies: []
            depends_on: []
            # No FR and no UC on purpose: a pure refactor with no behaviour delta.
            # Correction to this row as first written: it claimed
            # `clippy::too_many_arguments` would fire at nine chords in a build that
            # runs -D warnings. Reading the source shows `match_shortcut` already
            # carried an explicit `#[allow(clippy::too_many_arguments)]`, so the lint
            # was already silenced and nine parameters would not have failed the
            # build. The refactor still earns its place, on the reason that survives
            # the correction: the six chords travelled through a tuple return, six
            # positional parameters, six runtime fields and six assignment statements
            # — four parallel lists, and a new action missed in any one of them fails
            # silently, the chord simply never firing.
            tests:
              - hook::tests::exact_primary_match
              - hook::tests::exact_snap_left_match
              - hook::tests::modifier_superset_does_not_match
              - hook::tests::config_snapshot_replaces_every_chord

