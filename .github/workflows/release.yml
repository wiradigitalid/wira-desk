# Publishes the installer, the loose binaries, and checksums on a version tag, then hands
# the release to winget so `winget upgrade` is the update path.
#
# Read `SECURITY.md` before trusting a download: these binaries are NOT code-signed, and a
# checksum published beside the file it describes proves the download was not corrupted in
# transit — it does not prove who produced it. Building from source is still the stronger
# check.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      # `secrets` is not readable from a job-level `if`, so the decision is made here, in a
      # step, and handed downstream as an output.
      publish-winget: ${{ steps.flags.outputs.winget }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag agrees with the crate version
        shell: pwsh
        run: |
          # The tag names the release and the installer file; the crate version is what the
          # binaries report about themselves, what the Add/Remove Programs entry will show,
          # and what `verify-public-export.ps1` already holds consistent across the tree. A
          # release where the two disagree ships an installer that contradicts the program
          # it installs, so it is refused here rather than discovered by a user.
          $meta = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $crate = ($meta.packages | Where-Object { $_.name -eq 'daemon' }).version
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($crate -ne $tag) {
            throw "tag $env:GITHUB_REF_NAME implies version $tag, but crates/daemon is $crate"
          }
          "VERSION=$crate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Changelog has a section for this tag
        shell: pwsh
        run: |
          # A tag with no changelog section fails HERE, before anything is built or
          # published, because the alternative is a release whose notes nobody wrote — and
          # the in-app updater shows this text to the user before they decide to update, so
          # an empty section is a worse outcome than a failed workflow.
          #
          # Extracts `## [x.y.z]` up to the next `## ` heading. Emptiness is a failure too:
          # a heading with nothing under it would otherwise pass and publish silence.
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+\[$([regex]::Escape($env:VERSION))\]") { $start = $i; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## [$env:VERSION]' section. Add one before tagging; see the note at the top of that file."
          }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { break }
            $body.Add($lines[$i])
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) {
            throw "CHANGELOG.md section '## [$env:VERSION]' is empty. Release notes are read by users through the updater, so an empty section is not publishable."
          }
          Set-Content changelog-section.md -Value $text -Encoding utf8
          Write-Host "--- notes for $env:VERSION ---"
          Write-Host $text

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Downloaded and checksum-verified rather than taken from the runner image or a
          # package manager, for the reason `ci.yml` already states about gitleaks and
          # cargo-deny: a pinned version plus a published SHA-256 is the least this should
          # do, and bumping the version means updating the checksum in the same commit.
          #
          # THE CHECKSUM IS ALSO THE VERSION PIN. CVE-2025-15595 is a local privilege
          # escalation in Inno Setup installers by DLL hijacking during install; 6.2.1 and
          # earlier are vulnerable, and our installer runs elevated, which is exactly the
          # exploitable shape. A matching SHA-256 identifies this build bit-for-bit, so it
          # cannot be 6.2.1. Never pin below 6.2.2.
          #
          # The floor is ALSO asserted, but in the build step rather than here, and that
          # placement is deliberate. Nothing in this package reports its own version
          # usefully: `ISCC /?` prints only "Inno Setup 6", and the version resources of
          # `ISCC.exe`, `ISCmplr.dll`, and `Compil32.exe` are all `0.0.0.0`. The precise
          # version appears in exactly one place — the compiler's banner while compiling —
          # so that is where it is checked. An earlier attempt asserted it here against
          # `ISCC /?` and would have thrown on every run: a gate that cannot pass where it
          # was written.
          #
          # Pinned to the 6.x line rather than 7.x deliberately; `packaging/wiradesk.iss`
          # carries the reason in full.
          #
          # `/PORTABLE=1` is why this needs no elevation and leaves no machine state: it
          # unpacks the compiler into a directory instead of installing it. The download is
          # from GitHub Releases, which is where jrsoftware publishes — the `files.
          # jrsoftware.org/is/6/...` path that looks canonical returns 404 for this
          # version, and that was found by checking rather than by a failed release.
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          curl.exe -sSLf -o innosetup.exe 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $actual = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Inno Setup checksum mismatch: got $actual" }
          $dir = Join-Path $PWD 'inno'
          & .\innosetup.exe /PORTABLE=1 /VERYSILENT /SUPPRESSMSGBOXES "/DIR=$dir" | Out-Null
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) {
            throw "ISCC.exe not found in $dir after the portable install"
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the installer
        shell: pwsh
        run: |
          # No version is passed in. `wiradesk.iss` reads it out of the staged binary's own
          # version resource, so the installer cannot disagree with the program it
          # installs. The tag-versus-crate step above is still needed and still earns its
          # place: it guards the tag, which names the release, not the installer.
          New-Item -ItemType Directory stage, dist | Out-Null
          Copy-Item target\release\wiradesk.exe, target\release\wiradesk-settings.exe stage\
          Copy-Item LICENSE, NOTICE stage\
          Copy-Item crates\daemon\wiradesk.ico stage\
          $out = & ISCC.exe "/DSTAGE_DIR=$PWD\stage" "/DOUT_DIR=$PWD\dist" packaging\wiradesk.iss
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          # The security floor, asserted against the compiler that actually just ran. See
          # the install step for why it lives here and not there. Absence of the line is a
          # failure, not a pass, so a future Inno release that stops printing it breaks
          # loudly instead of silently disabling this check.
          $m = $out | Select-String -Pattern 'Compiler engine version: Inno Setup ([\d.]+)' | Select-Object -First 1
          if (-not $m) { throw 'could not read the Inno Setup engine version from the compiler output' }
          $engine = $m.Matches.Groups[1].Value
          if ([version]$engine -lt [version]'6.2.2') {
            throw "Inno Setup $engine is vulnerable to CVE-2025-15595; 6.2.2 or later is required"
          }
          Write-Host "Inno Setup engine $engine, above the 6.2.2 floor"

          $setup = "dist\WiraDesk-$env:VERSION-x64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "expected $setup; ISCC named it from the binary's version resource, so this means the resource and the crate disagree"
          }

      - name: Stage artefacts and checksums
        shell: pwsh
        run: |
          # The loose executables ship beside the installer on purpose: `README.md`
          # documents placing them by hand, and someone auditing a release should be able
          # to check the program without running an installer to get at it.
          Copy-Item target\release\wiradesk.exe, target\release\wiradesk-settings.exe dist\
          Get-FileHash dist\*.exe -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist\SHA256SUMS -Encoding ascii
          Get-Content dist\SHA256SUMS

      - name: Publish latest.json for the in-app updater
        shell: pwsh
        run: |
          # THIS FILE IS THE UPDATE CHANNEL, and its name is the whole point. Because the
          # name never changes, `releases/latest/download/latest.json` is a permanently
          # stable URL: no GitHub API, no rate limit, no HTML to parse. The installer
          # filename carries a version and therefore cannot sit behind a stable link, which
          # is the problem this file exists to solve.
          #
          # Read by two consumers that must not disagree, so there is one file rather than
          # two: the application's own updater, and the download page on wiradigital.id.
          #
          # The hash here is what the updater checks a download against before executing
          # it. Until a code-signing certificate exists it is the only verification there
          # is, which makes this step security-relevant rather than metadata: it must be
          # the hash of the artefact actually published, computed here, never transcribed.
          $setupName = "WiraDesk-$env:VERSION-x64-setup.exe"
          $setup = Join-Path 'dist' $setupName
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          [ordered]@{
            version      = $env:VERSION
            released     = (Get-Date -Format 'yyyy-MM-dd')
            setup_url    = "$base/$setupName"
            setup_sha256 = $sha
            notes_url    = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          } | ConvertTo-Json | Set-Content dist\latest.json -Encoding utf8
          Get-Content dist\latest.json

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two ways to install, and neither is presented as the way to update. Updating is
          # a button inside the application -- Settings, "Check for updates" -- which
          # downloads this installer, verifies it, and runs it. A user is never asked to
          # type a command to stay current, and a previous version of these notes did
          # exactly that, which is why the omission is called out rather than left silent.
          # The changelog section first, then the boilerplate that is true of every
          # release. The section is the part written for a person; everything below it is
          # standing information, and the last two lines are a licence term.
          $notes = @(
            (Get-Content changelog-section.md -Raw).Trim(),
            '',
            '---',
            '',
            'Install with the setup executable, or through winget:',
            '',
            '    winget install WiraDigitalIndonesia.WiraDesk',
            '',
            'Updating is built in: Settings has a "Check for updates" button. Whichever way',
            'you installed, that button is the update path, and it needs no command line.',
            '',
            'The installer places Wira Desk under %ProgramFiles%, which is deliberate and not',
            'configurable to a per-user location. Auto-start runs the daemon elevated at every',
            'logon with no prompt, so a directory only administrators can write is what protects',
            'it. Installing it anywhere a normal user can write turns that into a privilege',
            'escalation route -- see SECURITY.md.',
            '',
            'Verify your download against SHA256SUMS before running:',
            '',
            '    Get-FileHash .\WiraDesk-' + $env:VERSION + '-x64-setup.exe -Algorithm SHA256',
            '',
            'These binaries are not code-signed, so Windows SmartScreen will warn and the',
            'UAC prompt will show an unverified publisher. See SECURITY.md for what that',
            'does and does not tell you.',
            '',
            'Made with Slint (https://slint.dev), used under the Slint Royalty-free',
            'License 2.0. That licence requires this disclosure on the page the binaries',
            'are downloaded from, which is this one -- so these two lines are a licence',
            'term, not a credit. See deny.toml for which branch of the licence applies.'
          ) -join "`n"
          gh release create $env:GITHUB_REF_NAME `
            (Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }) dist\SHA256SUMS dist\latest.json `
            --title $env:GITHUB_REF_NAME --notes $notes

      - name: Decide whether winget can be updated
        id: flags
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $has = if ($env:WINGET_TOKEN) { 'true' } else { 'false' }
          "winget=$has" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  winget:
    # Submits a manifest pull request to microsoft/winget-pkgs, which is what makes
    # `winget upgrade` find the new version. Skipped entirely when the secret is absent, so
    # the release above still succeeds on a repository that has not done the setup.
    #
    # Three things must exist before this can work, and none of them can be created from
    # here:
    #   1. A fork of microsoft/winget-pkgs under the same account as this repository.
    #   2. A CLASSIC personal access token with `public_repo` scope, stored as the
    #      `WINGET_TOKEN` secret. Fine-grained tokens are not supported by the action.
    #   3. One version of the package already accepted into winget-pkgs. The first
    #      submission is a manual pull request; this automates every release after it.
    needs: release
    if: needs.release.outputs.publish-winget == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: WiraDigitalIndonesia.WiraDesk
          # Matches only the setup executable. The loose binaries published beside it are
          # not installers and must not end up in the manifest.
          installers-regex: '-x64-setup\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
