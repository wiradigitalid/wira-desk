# Two tools are downloaded and checksum-verified rather than installed through an
# action. Actions are referenced by tag and kept current by Dependabot, which is a
# reasonable integrity story for them; gitleaks and cargo-deny are raw binary
# downloads with no other mechanism, and they are the security gates themselves, so
# a pinned version plus a published SHA-256 is the least this should do. Bumping
# either version means updating its checksum in the same commit â€” deliberately, so
# the bump is visible.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          # The daemon links an elevation manifest, which would make the test harness
          # itself require elevation and fail before a single test ran.
          WIRADESK_SKIP_MANIFEST: "1"
      - name: Release build
        run: cargo build --workspace --release --locked

      # The installer is compiled on every push, not only on a version tag. A packaging
      # script that is only exercised at release time is a script that breaks at release
      # time, when the tag is already pushed and the fix costs a retag. The Inno pin, the
      # 6.2.2 security floor it must never drop below, and why the download comes from
      # GitHub Releases are all explained in `release.yml`; version and checksum must be
      # bumped in both files together.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          curl.exe -sSLf -o innosetup.exe 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $actual = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Inno Setup checksum mismatch: got $actual" }
          $dir = Join-Path $PWD 'inno'
          & .\innosetup.exe /PORTABLE=1 /VERYSILENT /SUPPRESSMSGBOXES "/DIR=$dir" | Out-Null
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) {
            throw "ISCC.exe not found in $dir after the portable install"
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Installer builds
        shell: pwsh
        run: |
          # No version is passed. `wiradesk.iss` reads it out of the staged binary's own
          # version resource, so a mismatch between installer and program is not possible
          # rather than merely checked.
          New-Item -ItemType Directory stage, dist | Out-Null
          Copy-Item target\release\wiradesk.exe, target\release\wiradesk-settings.exe stage\
          Copy-Item LICENSE, NOTICE stage\
          Copy-Item crates\daemon\wiradesk.ico stage\
          $out = & ISCC.exe "/DSTAGE_DIR=$PWD\stage" "/DOUT_DIR=$PWD\dist" packaging\wiradesk.iss
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $m = $out | Select-String -Pattern 'Compiler engine version: Inno Setup ([\d.]+)' | Select-Object -First 1
          if (-not $m) { throw 'could not read the Inno Setup engine version from the compiler output' }
          if ([version]$m.Matches.Groups[1].Value -lt [version]'6.2.2') {
            throw "Inno Setup $($m.Matches.Groups[1].Value) is vulnerable to CVE-2025-15595; 6.2.2 or later is required"
          }
          Get-ChildItem dist

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Required. `gitleaks git` walks history, and the default shallow clone
          # would leave it scanning a single commit while still reporting success.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan history
        run: ./gitleaks git . --redact --no-banner -c .gitleaks.toml
      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner -c .gitleaks.toml

  dependencies:
    # Windows, matching the only target the product is built for and the platform this
    # configuration was verified on. `deny.toml` pins the graph to
    # `x86_64-pc-windows-msvc`, which is what keeps Linux-only advisories in the
    # lockfile from failing a Windows-only product.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        shell: pwsh
        run: |
          $version = '0.20.2'
          $expected = '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc'
          $asset = "cargo-deny-$version-x86_64-pc-windows-msvc"
          Invoke-WebRequest -Uri "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$asset.tar.gz" -OutFile deny.tar.gz
          $actual = (Get-FileHash deny.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "cargo-deny checksum mismatch: got $actual" }
          tar xzf deny.tar.gz
          Join-Path $PWD $asset | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Advisories, licences, bans, sources
        run: cargo-deny check

  publication-hygiene:
    # The same gate the export runs, so a contribution cannot reintroduce what the export
    # was built to keep out: a local path, an internal identifier, an unapproved claim.
    # `-SkipHistory` because this repository legitimately accumulates commits after its
    # initial release, while a fresh export must have exactly one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publication hygiene
        shell: pwsh
        run: ./scripts/verify-public-export.ps1 -Path . -SkipHistory