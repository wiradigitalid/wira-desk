[package]
name = "daemon"
version.workspace = true
edition = "2021"
description = "Elevated system-tray daemon for Wira Desk window tools"
license = "MIT"
repository = "https://github.com/wiradigitalid/wira-desk"
publish = false
default-run = "wiradesk"

[[bin]]
name = "wiradesk"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_Security",
    # Reading the DACL of the daemon's own executable (`acl`), to tell whether a
    # non-administrator could replace the file the logon task launches elevated.
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Performance"
] }

[build-dependencies]
embed-resource = "3.0"


[lints]
workspace = true
