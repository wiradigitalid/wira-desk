[package]
name = "settings"
version.workspace = true
edition = "2021"
description = "Settings UI for Wira Desk"
license = "MIT"
repository = "https://github.com/kodesh87/wira-desk"
publish = false
default-run = "wiradesk-settings"

[[bin]]
name = "wiradesk-settings"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
# Already in the lock file via Slint, so this adds a declaration rather than a new
# dependency. Declared on `settings` and not `shared`, because the daemon depends on
# `shared` and has no use for JSON.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.17", default-features = false, features = [
    "backend-winit",
    "renderer-skia",
    "accessibility",
    "compat-1-2",
] }
i-slint-backend-winit = "1.17"
winit = "0.30"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    # The updater. `WinHttp` fetches over HTTPS and `Cryptography` supplies SHA-256 through
    # CNG -- both from the `windows-sys` already here, so verifying a download does not widen
    # the supply chain of the thing doing the verifying.
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    # `ShellExecuteW`, which is the only way to launch a program whose manifest asks for
    # elevation -- `CreateProcess` cannot, and fails with 740.
    "Win32_UI_Shell",
] }

[build-dependencies]
embed-resource = "3.0"
slint-build = "1.17"


[lints]
workspace = true
