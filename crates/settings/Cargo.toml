[package]
name = "settings"
version = "0.1.0"
edition = "2021"
description = "Settings UI for Wira Desk"
license = "MIT"
repository = "https://github.com/kodesh87/wira-desk"
publish = false
default-run = "wiradesk-settings"

[[bin]]
name = "wiradesk-settings"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
slint = { version = "1.17", features = ["backend-winit", "renderer-skia", "accessibility"] }
i-slint-backend-winit = "1.17"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
embed-resource = "3.0"
slint-build = "1.17"


[lints]
workspace = true
