# Gitleaks configuration for the secret-scan gate.
#
# Run both modes; both must exit 0:
#   gitleaks git . --redact
#   gitleaks dir . --redact
#
# A non-zero exit means a new candidate appeared and must be triaged. Do not silence one
# by widening the allowlists below.
#
# This file is used unchanged by CI and by local scans, deliberately: one config means
# the two cannot drift into disagreeing about what passes. A second, generated copy is
# the easiest way to end up with a green gate in one place and a red one in the other.

[extend]
useDefault = true

# ── Known false positive ─────────────────────────────────────────────────────────────
# A generated file manifest in this project's tooling directory lists `path,hash` rows
# whose `hash` column is a SHA-256 of the file's contents. The `generic-api-key` rule
# fires on exactly one of its ~290 rows, because that row's `name` column happens to
# contain the substring "key" — the literal word next to a high-entropy value is the
# entire match. It is a content hash, not a credential.
#
# Scoped by the *shape of the row*, and the two obvious alternatives were both rejected
# for measured reasons:
#
#   - `paths` was tried first and is wrong. A global allowlist entry carrying `paths`
#     exempts the whole file before the rules run, so real credentials in that same file
#     stopped being reported. `matchCondition = "AND"` alongside `regexes` does not
#     rescue it — the file-level skip still wins. Verified by planting credentials in
#     the file: the stock rules reported four findings (three planted, plus this false
#     positive) while that config reported none of them.
#   - `.gitleaksignore` fingerprints embed a line number, and the file is regenerated by
#     a tool this project does not control, so a reordered manifest would silently
#     re-open the finding as a fresh one.
#
# Matching `.md","<64 lowercase hex>"` against the matched span suppresses only that row
# format. With it, the same planted-credential test reports exactly the three real ones.
#
# If you re-test this, do not use AWS's documentation values (`AKIAIOSFODNN7EXAMPLE`, or
# anything ending `EXAMPLEKEY`). Gitleaks' default config already allowlists them as
# known examples, so they pass regardless of anything here and read as a false pass.
[[allowlists]]
description = "SHA-256 content-hash rows in a generated file manifest"
regexTarget = "match"
regexes = ['''\.md","[0-9a-f]{64}"''']

# ── Build output ─────────────────────────────────────────────────────────────────────
# `dir` mode otherwise walks `target/`, which took the first scan from ~14 MB to ~2.6 GB
# and 28 s; excluding it brings the working-tree scan to ~10 MB in under a second. A
# whole-file skip is exactly the intent here — the semantics that made `paths` wrong for
# the manifest above are correct for generated artefacts that are neither committed
# (`target/` is gitignored) nor published.
[[allowlists]]
description = "Cargo build artefacts"
paths = ['''^target/''', '''/target/''']
