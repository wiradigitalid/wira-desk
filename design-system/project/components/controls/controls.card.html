<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px; color: var(--text-strong); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 32px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row + .lbl { margin-top: 20px; }
</style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#FBF9F6">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#FBF9F6"/>
      <rect x="360" y="300" width="300" height="90" rx="16" fill="#C63A28"/>
      <rect x="690" y="300" width="150" height="90" rx="16" fill="none" stroke="#D3CABD" stroke-width="4"/>
      <rect x="360" y="430" width="130" height="60" rx="30" fill="#C63A28"/>
      <circle cx="460" cy="460" r="22" fill="#fff"/>
      <rect x="520" y="435" width="60" height="50" rx="10" fill="#fff" stroke="#D3CABD" stroke-width="3"/>
    </svg>
  </template>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Toggle, Keycap, ShortcutInput } = window.WiraDigitalDesignSystem_61a646;
    function Demo() {
      const [on1, setOn1] = React.useState(true);
      const [on2, setOn2] = React.useState(false);
      const [combo, setCombo] = React.useState(["Win", "`"]);
      return (
        <div className="grid">
          <div>
            <p className="lbl">Button — variants</p>
            <div className="row">
              <Button>Unduh gratis</Button>
              <Button variant="secondary">Pelajari</Button>
              <Button variant="ghost">Lewati</Button>
            </div>
            <p className="lbl">Sizes · danger · native</p>
            <div className="row">
              <Button size="sm">Small</Button>
              <Button size="lg">Large</Button>
              <Button variant="danger">Exit</Button>
              <Button variant="native" size="sm">OK</Button>
            </div>
          </div>
          <div>
            <p className="lbl">Toggle — brand &amp; native</p>
            <div className="row" style={{flexDirection:"column",alignItems:"stretch",gap:14,maxWidth:280}}>
              <Toggle checked={on1} onChange={setOn1} label="Enable window snapping" description="Ctrl + Win + arrows" />
              <Toggle native checked={on2} onChange={setOn2} label="Start with Windows" />
            </div>
          </div>
          <div>
            <p className="lbl">Keycap — combos</p>
            <div className="row">
              <Keycap combo={["Win", "`"]} />
              <Keycap combo={["Ctrl","Win","Enter"]} tone="brand" />
              <Keycap>Esc</Keycap>
            </div>
          </div>
          <div>
            <p className="lbl">ShortcutInput — click to listen</p>
            <div className="row">
              <ShortcutInput value={combo} onChange={setCombo} />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
