<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid · space-1 → space-16 · generous whitespace = calm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-mono); padding: 20px 24px; }
  .r { display: flex; align-items: center; gap: 14px; margin-bottom: 7px; }
  .bar { height: 16px; background: var(--saga-400); border-radius: 3px; }
  .lab { font-size: 11px; color: var(--text-body); width: 120px; }
  .lab b { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="r"><span class="lab"><b>1</b> · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="lab"><b>2</b> · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="lab"><b>4</b> · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="lab"><b>6</b> · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="lab"><b>8</b> · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="lab"><b>12</b> · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="r"><span class="lab"><b>16</b> · 64px</span><div class="bar" style="width:64px"></div></div>
</body>
</html>
