<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="12 → 76px · Plus Jakarta Sans · one calm ramp for the whole brand" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); padding: 16px 24px; }
  .r { display: flex; align-items: baseline; gap: 14px; padding: 3px 0; border-bottom: 1px solid var(--border-subtle); }
  .r:last-child { border: 0; }
  .t { flex: 1; letter-spacing: var(--tracking-snug); line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 92px; text-align: right; flex: none; }
</style>
</head>
<body>
  <div class="r"><span class="t" style="font-size:48px;font-weight:800;letter-spacing:var(--tracking-tight)">Wira Digital</span><span class="m">5xl · 48 · 800</span></div>
  <div class="r"><span class="t" style="font-size:38px;font-weight:700">Ringan &amp; jujur</span><span class="m">4xl · 38 · 700</span></div>
  <div class="r"><span class="t" style="font-size:30px;font-weight:600">Window cycling</span><span class="m">3xl · 30 · 600</span></div>
  <div class="r"><span class="t" style="font-size:24px;font-weight:600">Section heading</span><span class="m">2xl · 24 · 600</span></div>
  <div class="r"><span class="t" style="font-size:20px;font-weight:500">Subhead / lead</span><span class="m">xl · 20 · 500</span></div>
  <div class="r"><span class="t" style="font-size:16px;font-weight:400">Body — paragraph text</span><span class="m">base · 16 · 400</span></div>
  <div class="r"><span class="t" style="font-size:14px;font-weight:400;color:var(--text-body)">Small / secondary</span><span class="m">sm · 14 · 400</span></div>
  <div class="r"><span class="t" style="font-size:12px;font-weight:400;color:var(--text-muted)">Caption &amp; meta</span><span class="m">xs · 12 · 400</span></div>
</body>
</html>
