<!-- @dsCard group="Colors" viewport="700x180" name="Native Windows 11 surfaces" subtitle="WinTick's in-product world · Fluent light + dark · brand red never appears here" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-native); padding: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-md); }
  .bar { padding: 7px 12px; font-size: 12px; font-weight: 600; display:flex; justify-content:space-between; }
  .body { padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { width: 100%; display:flex; gap: 8px; }
  .box { flex:1; height: 34px; border-radius: 4px; font-size: 9px; display:flex; align-items:flex-end; padding: 3px 5px; }
  .accent { height: 26px; border-radius: 4px; padding: 4px 8px; font-size: 11px; font-weight:600; display:inline-flex; align-items:center; }
</style>
</head>
<body>
  <div class="grid">
    <div class="pane native" style="background:var(--n-bg-app)">
      <div class="bar" style="background:var(--n-bg-layer);color:var(--n-text-primary);border-bottom:1px solid var(--n-stroke)"><span>Light</span><span style="color:var(--n-text-secondary);font-weight:400">.native</span></div>
      <div class="body">
        <div class="sw">
          <div class="box" style="background:var(--n-bg-layer);color:var(--n-text-secondary);border:1px solid var(--n-stroke)">layer</div>
          <div class="box" style="background:var(--n-bg-solid);color:var(--n-text-secondary);border:1px solid var(--n-stroke)">solid</div>
          <div class="box" style="background:var(--n-bg-subtle);color:var(--n-text-secondary)">subtle</div>
        </div>
        <span class="accent" style="background:var(--n-accent);color:var(--n-accent-text)">Accent #0067C0</span>
        <span class="accent" style="background:var(--n-tray-alert);color:#fff">Tray alert #E81123</span>
      </div>
    </div>
    <div class="pane native dark" style="background:var(--n-bg-app)">
      <div class="bar" style="background:var(--n-bg-layer);color:var(--n-text-primary);border-bottom:1px solid var(--n-stroke)"><span>Dark</span><span style="color:var(--n-text-secondary);font-weight:400">.native.dark</span></div>
      <div class="body">
        <div class="sw">
          <div class="box" style="background:var(--n-bg-layer);color:var(--n-text-secondary);border:1px solid var(--n-stroke)">layer</div>
          <div class="box" style="background:var(--n-bg-solid);color:var(--n-text-secondary);border:1px solid var(--n-stroke)">solid</div>
          <div class="box" style="background:var(--n-bg-subtle);color:var(--n-text-secondary)">subtle</div>
        </div>
        <span class="accent" style="background:var(--n-accent);color:var(--n-accent-text)">Accent #4CC2FF</span>
        <span class="accent" style="background:var(--n-tray-alert);color:#fff">Tray alert #E81123</span>
      </div>
    </div>
  </div>
</body>
</html>
