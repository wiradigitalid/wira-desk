<!-- @dsCard group="Brand" viewport="700x170" name="Product glyph — WinTick" subtitle="generic 'stacked windows' function mark · brand + tray + mono variants" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 20px 24px; color: var(--text-strong); }
  .row { display: flex; align-items: center; gap: 30px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .tile { width: 64px; height: 64px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
  .wm { display:flex; align-items:center; gap: 10px; }
  .wm .t { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .wm .t span { color: var(--saga-500); }
</style>
</head>
<body>
  <div class="row">
    <div class="item">
      <img src="../assets/wintick-glyph.svg" width="64" height="64" alt="">
      <span class="cap">brand · 128px</span>
    </div>
    <div class="item">
      <div class="tile" style="background:var(--tanah-900);color:#fff"><img src="../assets/wintick-glyph-mono.svg" width="34" height="34" alt=""></div>
      <span class="cap">tray · white</span>
    </div>
    <div class="item">
      <div class="tile" style="background:var(--tanah-100);color:var(--tanah-800)"><img src="../assets/wintick-glyph-mono.svg" width="34" height="34" alt=""></div>
      <span class="cap">mono · ink</span>
    </div>
    <div style="width:1px;height:64px;background:var(--border-subtle)"></div>
    <div class="item">
      <div class="wm"><img src="../assets/wintick-glyph.svg" width="40" height="40" alt=""><span class="t">Win<span>Tick</span></span></div>
      <span class="cap">product lockup</span>
    </div>
  </div>
</body>
</html>
