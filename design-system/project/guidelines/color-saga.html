<!-- @dsCard group="Colors" viewport="700x150" name="Saga — primary brand red" subtitle="merah saga · warm brick red · primary actions & brand fills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { display: flex; gap: 0; padding: 20px; }
  .sw { flex: 1; height: 92px; border-radius: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; box-sizing: border-box; }
  .wrap .sw:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .wrap .sw:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .name { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: .8; }
  .lite { color: var(--tanah-800); }
  .dark { color: #fff; }
  .tag { display:inline-block; margin-top:2px; font-size:9px; font-family:var(--font-mono); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw lite" style="background:var(--saga-50)"><span class="name">50</span><span class="hex">#FBF0ED</span></div>
    <div class="sw lite" style="background:var(--saga-100)"><span class="name">100</span><span class="hex">#F6DAD3</span></div>
    <div class="sw lite" style="background:var(--saga-200)"><span class="name">200</span><span class="hex">#EDB3A6</span></div>
    <div class="sw lite" style="background:var(--saga-300)"><span class="name">300</span><span class="hex">#E08B77</span></div>
    <div class="sw dark" style="background:var(--saga-400)"><span class="name">400</span><span class="hex">#D4644C</span></div>
    <div class="sw dark" style="background:var(--saga-500)"><span class="name">500 ●</span><span class="hex">#C63A28</span></div>
    <div class="sw dark" style="background:var(--saga-600)"><span class="name">600</span><span class="hex">#A82F20</span></div>
    <div class="sw dark" style="background:var(--saga-700)"><span class="name">700</span><span class="hex">#85261A</span></div>
    <div class="sw dark" style="background:var(--saga-800)"><span class="name">800</span><span class="hex">#631C13</span></div>
    <div class="sw dark" style="background:var(--saga-900)"><span class="name">900</span><span class="hex">#42130D</span></div>
  </div>
</body>
</html>
