<!-- @dsCard group="Type" viewport="700x180" name="Display — Plus Jakarta Sans" subtitle="brand headlines · tight tracking · an Indonesian-origin typeface (identity of Jakarta)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-strong); padding: 22px 24px; }
  .eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--eyebrow); margin: 0 0 10px; }
  .d1 { font-size: 52px; font-weight: 800; letter-spacing: var(--tracking-tight); line-height: 1.02; margin: 0; }
  .d2 { font-size: 30px; font-weight: 600; letter-spacing: var(--tracking-snug); line-height: 1.1; margin: 10px 0 0; color: var(--text-body); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 12px; }
</style>
</head>
<body>
  <p class="eyebrow">Kebanggaan lokal</p>
  <h1 class="d1">Ringan, jujur, tak&nbsp;terlihat.</h1>
  <p class="d2">Switch windows like on a Mac. On Windows.</p>
  <p class="meta">800 / 600 · tracking −0.02em · leading 1.02–1.1</p>
</body>
</html>
