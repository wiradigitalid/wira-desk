<!-- @dsCard group="Colors" viewport="700x150" name="Tanah — warm stone neutrals" subtitle="paper → ink · every brand surface sits on warm neutrals, never cold gray" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .wrap { display: flex; padding: 20px; }
  .sw { flex: 1; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; box-sizing: border-box; }
  .wrap .sw:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .wrap .sw:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .name { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: .75; }
  .lite { color: var(--tanah-800); }
  .dark { color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw lite" style="background:var(--tanah-50);box-shadow:inset 0 0 0 1px var(--tanah-200)"><span class="name">50</span><span class="hex">#FBF9F6</span></div>
    <div class="sw lite" style="background:var(--tanah-100)"><span class="name">100</span><span class="hex">#F4F0EA</span></div>
    <div class="sw lite" style="background:var(--tanah-200)"><span class="name">200</span><span class="hex">#E7E1D8</span></div>
    <div class="sw lite" style="background:var(--tanah-300)"><span class="name">300</span><span class="hex">#D3CABD</span></div>
    <div class="sw lite" style="background:var(--tanah-400)"><span class="name">400</span><span class="hex">#A99E8E</span></div>
    <div class="sw dark" style="background:var(--tanah-500)"><span class="name">500</span><span class="hex">#7D7263</span></div>
    <div class="sw dark" style="background:var(--tanah-600)"><span class="name">600</span><span class="hex">#5C5346</span></div>
    <div class="sw dark" style="background:var(--tanah-700)"><span class="name">700</span><span class="hex">#423B31</span></div>
    <div class="sw dark" style="background:var(--tanah-800)"><span class="name">800</span><span class="hex">#2A251E</span></div>
    <div class="sw dark" style="background:var(--tanah-900)"><span class="name">900 ink</span><span class="hex">#1A1611</span></div>
  </div>
</body>
</html>
