<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px 24px; color: var(--text-strong); }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .mono { width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--saga-500); color: #fff; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; letter-spacing: -0.04em; }
  .name { line-height: 1.05; }
  .name .a { font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
  .name .b { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
  .dot { color: var(--saga-500); }
  .row2 { display: flex; gap: 28px; align-items: center; margin-top: 20px; }
  .onink { background: var(--tanah-900); border-radius: var(--radius-md); padding: 12px 16px; display:flex; align-items:center; gap:12px; }
  .onink .mono2 { width: 34px; height: 34px; border-radius: var(--radius-sm); background:#fff; color: var(--saga-600); font-weight:800; font-size:20px; display:flex;align-items:center;justify-content:center; }
  .onink .t { color:#fff; font-weight:700; font-size:18px; letter-spacing:-0.02em; }
  .note { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-top: 14px; }
</style>
</head>
<body>
  <div class="lockup">
    <div class="mono">W</div>
    <div class="name">
      <span class="a">Wira<span class="dot">.</span>Digital</span>
      <span class="b">Indonesia · software studio</span>
    </div>
  </div>
  <div class="row2">
    <div class="onink">
      <div class="mono2">W</div>
      <span class="t">Wira Digital</span>
    </div>
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">Monogram = letter “W”, Plus Jakarta Sans 800, saga tile</span>
  </div>
  <p class="note">⚠ Placeholder typographic mark — not a final logo. Replace when ready.</p>
</body>
</html>
